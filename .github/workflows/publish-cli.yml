name: Publish Centaur CLI

on:
  push:
    branches: [main]
    paths:
      - centaur_cli/__init__.py
      - pyproject.toml
      - .github/workflows/publish-cli.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: centaur-cli-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: macos-latest, python: '3.13'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      # Static deployment tests require Linux; CLI/installer tests also run on macOS.
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q centaur_cli

  computer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth xclip
      - run: python -m pip install '.[computer]'
      - name: Verify capture and input in a disposable desktop
        run: xvfb-run -a -s '-screen 0 800x600x24' env CENTAUR_TEST_DESKTOP=1 python -m unittest discover -s tests -p test_computer_desktop.py -v

  build:
    needs: [test, computer]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - id: version
        run: |
          version=$(python -c 'from centaur_cli import __version__; print(__version__)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct)" >> "$GITHUB_ENV"
      - run: python -m pip install build==1.3.0 twine==6.2.0 setuptools==80.9.0 wheel==0.45.1
      - run: python -m build --no-isolation
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_dist.py dist
      - run: sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: centaur-cli-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: centaur-cli-${{ needs.build.outputs.version }}-${{ github.sha }}
      - name: Publish immutable versioned GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="cli-v$VERSION"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > "$RUNNER_TEMP/tag.json" 2>/dev/null; then
            python3 -c 'import json,os; x=json.load(open(os.environ["RUNNER_TEMP"]+"/tag.json"))["object"]; assert x["type"]=="commit" and x["sha"]==os.environ["GITHUB_SHA"], "Version tag already points to another commit; bump the version."'
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            printf 'Centaur CLI %s\n\nPython 3.10+; Linux/macOS. See README for backends, installation and usage.\n\nPyPI publishing runs separately; consult its job before assuming pip install centaur-cli is available.\n' "$VERSION" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$tag" --target "$GITHUB_SHA" --title "Centaur CLI $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          for file in dist/* SHA256SUMS; do
            name=$(basename "$file")
            mkdir -p "$RUNNER_TEMP/existing-assets"
            if gh release download "$tag" --pattern "$name" --dir "$RUNNER_TEMP/existing-assets"; then
              cmp "$file" "$RUNNER_TEMP/existing-assets/$name"
            else
              gh release upload "$tag" "$file"
            fi
          done

  pypi:
    needs: [build, release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/centaur-cli/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: centaur-cli-${{ needs.build.outputs.version }}-${{ github.sha }}
      - name: Publish to PyPI using the configured Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
