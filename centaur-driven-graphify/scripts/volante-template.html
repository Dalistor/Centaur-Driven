*{box-sizing:border-box;scrollbar-color:var(--scroll) var(--bg);scrollbar-width:thin}*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-track{background:var(--bg)}*::-webkit-scrollbar-thumb{background:var(--scroll);border:2px solid var(--bg);border-radius:8px}*::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover)}*::-webkit-scrollbar-thumb:active{background:var(--ink)}body{margin:0;font-size:15px;line-height:1.55}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:var(--display);line-height:1.2}h1{font-size:clamp(26px,3vw,38px);letter-spacing:-.035em;margin-bottom:12px}h2{font-size:22px}h3{font-size:17px}a{color:var(--brand);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}button{cursor:pointer;font:inherit}button,a,input,select,textarea{touch-action:manipulation}:focus-visible{outline:3px solid var(--brand);outline-offset:4px}button:disabled{cursor:not-allowed;opacity:.5}button:active{transform:translateY(1px)}button:disabled:active{transform:none}button,input,select,textarea{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}button{padding:9px 14px;font-weight:600}button:hover{background:#e6edfa;border-color:var(--brand)}input,select{font:inherit;padding:10px 12px;min-height:44px}textarea{font:inherit;padding:12px;width:100%;min-height:140px;resize:none}select{max-width:220px}pre,code,.mono{font-family:var(--mono);font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}code{overflow-wrap:anywhere}.muted{color:var(--muted)}.small{font-size:12px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}.skip{position:fixed;top:-80px;left:12px;background:white;padding:12px;z-index:20}.skip:focus{top:12px}.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.rail{background:var(--rail);color:var(--rail-ink);padding:28px 18px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:25px;font-weight:700;letter-spacing:-.04em}.brand svg{width:32px;height:32px}.rail .eyebrow,.rail .muted{color:#bacbde}.project-name{font-weight:650;overflow-wrap:anywhere}.rail nav{display:grid;gap:7px}.rail nav a{color:#dce8f6;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:6px;font-size:14px}.rail nav a:hover{background:#244568;text-decoration:none}.rail nav a[aria-current=page]{background:#e4edff;color:var(--rail);font-weight:700}.nav-icon{font-family:var(--mono);font-size:12px;opacity:.85;width:20px}.rail-footer{margin-top:auto;border-top:1px solid #3f5570;padding-top:18px;font-size:12px}.rail-footer p{margin:0 0 8px}.main{min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--surface);border-bottom:1px solid var(--line);padding:17px 32px}.search{display:flex;align-items:center;gap:8px;min-width:0;flex:1;max-width:450px}.search input{width:100%;min-width:0}.search button{padding:8px 12px}.filter{display:flex;align-items:center;gap:10px}.content{max-width:1600px;margin:auto;padding:32px}.heading{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:24px}.heading p:last-child{margin-bottom:0}.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--line);background:#f3f6fa;border-radius:5px;font-size:11px;font-weight:650;line-height:1.6;white-space:normal}.chip.ok{color:var(--success);background:#ecf6ef;border-color:#b6d6c2}.chip.warn{color:var(--warning);background:#fff3df;border-color:#e6c58e}.chip.bad{color:var(--danger);background:#ffedf0;border-color:#e5b2bc}.chip.blue{color:var(--brand);background:#edf2ff;border-color:#b5c8f1}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.columns{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px;align-items:start}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:20px;min-width:0}.panel> :last-child{margin-bottom:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.section-head h2,.section-head h3{margin:0}.module-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.module{border-left:3px solid #a5bce1;padding-left:17px;min-width:0}.module .eyebrow{margin-bottom:5px}.module h3{margin-bottom:6px}.module p{margin-bottom:12px}.capability{display:block;border:1px solid var(--line);border-radius:7px;margin-bottom:9px;padding:14px;color:var(--ink);background:#f8fafd;overflow-wrap:anywhere}.capability:hover{background:#edf2ff;border-color:var(--brand);text-decoration:none}.capability strong{display:block;font-size:14px}.capability small{display:block;color:var(--muted);margin-top:4px}.summary-line{display:flex;gap:24px;flex-wrap:wrap;padding:16px 0 22px;border-bottom:1px solid var(--line);margin-bottom:24px}.summary-line strong{font-size:23px;font-family:var(--display);margin-right:7px}.summary-line span{font-size:13px;color:var(--muted)}.action{padding:14px 0;border-bottom:1px solid var(--line)}.action:first-of-type{padding-top:0}.action:last-child{border:0;padding-bottom:0}.action a{font-weight:650}.action p{font-size:13px;margin:5px 0 0}.empty{padding:28px 16px;text-align:center;background:#f7f9fc;border:1px dashed var(--line);border-radius:8px}.empty h3{margin-bottom:8px}.empty p{max-width:520px;margin:0 auto 12px}.notice{padding:14px 18px;background:#fff3df;border:1px solid #e6c58e;border-radius:7px;font-size:13px;margin-bottom:20px;overflow-wrap:anywhere}.notice details{margin:0}.notice ul{margin-bottom:0}.rule{padding:23px 0;border-top:1px solid var(--line)}.rule:first-child{border:0;padding-top:0}.rule-head{display:flex;justify-content:space-between;gap:12px}.rule h3{margin-bottom:10px}.rule-id{display:block;color:var(--muted);margin-bottom:7px}.rule p{margin-bottom:10px}.rule ul{padding-left:20px;font-size:14px}.trace{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:16px 0;border:1px solid var(--line);border-radius:7px;overflow:hidden}.trace>div{padding:12px;border-right:1px solid var(--line);min-width:0}.trace>div:last-child{border:0}.trace small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.trace strong{font-size:13px}.rule-footer{border-top:1px dashed var(--line);padding-top:12px;margin-top:16px;font-size:13px}.source{border:1px solid var(--line);border-radius:7px;margin:10px 0;overflow:hidden}.source summary{padding:12px;cursor:pointer;background:#f3f6fa;font-size:13px;overflow-wrap:anywhere}.source summary:hover{background:#e6edfa}.source pre{background:#152d49;color:#e5eefb;padding:18px;max-height:480px;overflow:auto;line-height:1.8;white-space:pre;tab-size:4}.source-meta{padding:10px 14px;font-size:12px;border-top:1px solid var(--line)}details>summary:focus-visible{outline-offset:-4px}details:not(.source)>summary{cursor:pointer;font-weight:650}details:not(.source)>summary:hover{color:var(--brand)}.evidence{border-left:3px solid #a5bce1;padding:8px 0 8px 15px;margin:15px 0;overflow-wrap:anywhere}.evidence p{font-size:13px;margin:7px 0}.detail-links{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.detail-links a{padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:13px}.back{display:inline-block;font-size:13px;margin-bottom:18px}.data-row{display:grid;grid-template-columns:150px minmax(0,1fr);padding:10px 0;border-bottom:1px solid var(--line);gap:14px;font-size:13px}.data-row:last-child{border:0}.data-row dt{color:var(--muted)}.data-row dd{margin:0;overflow-wrap:anywhere}.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0}.pagination span{font-size:13px;color:var(--muted)}.primary{background:var(--brand);color:white;border-color:var(--brand)}.primary:hover{background:#204da9;color:white}.note-help{font-size:12px;color:var(--muted);margin:8px 0}.label{display:block;font-size:13px;font-weight:650;margin:14px 0 8px}.status{position:fixed;bottom:20px;right:20px;max-width:min(450px,calc(100vw - 40px));padding:12px 18px;background:var(--rail);color:white;border-radius:8px;z-index:10}.status:empty{display:none}.document{max-height:600px;overflow:auto;padding:18px;background:#f3f6fa;margin-top:14px}.row-list{list-style:none;padding:0;margin:0}.row-list li{padding:14px 0;border-bottom:1px solid var(--line)}.row-list li:last-child{border:0}.row-list label{display:flex;gap:10px;align-items:start}.row-list input{min-height:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.screen-reader-count{min-height:20px;font-size:12px;color:var(--muted);margin:8px 0}.footer-note{font-size:12px;color:var(--muted);margin-top:25px}
@media(max-width:1100px){.columns{grid-template-columns:1fr}.columns>aside{display:grid;grid-template-columns:1fr 1fr;gap:18px}.content{padding:24px}.topbar{padding:14px 24px}}
@media(max-width:760px){.shell{grid-template-columns:1fr}.rail{position:static;height:auto;padding:18px;gap:14px}.rail nav{display:flex;flex-wrap:wrap;gap:5px}.rail nav a{padding:9px;font-size:12px}.rail-footer,.rail .project-block{display:none}.brand{font-size:22px}.topbar{flex-wrap:wrap;padding:14px 18px}.search{max-width:none;flex-basis:100%}.filter{width:100%;justify-content:space-between}.filter select{flex:1;max-width:none}.content{padding:22px 16px}.heading{display:block}.heading button{margin-top:15px}.columns>aside{display:block}.panel{padding:18px}.trace>div{padding:10px 8px}.trace strong{font-size:12px}.data-row{grid-template-columns:1fr;gap:3px}.rule-head{display:block}.summary-line{gap:15px}.nav-icon{display:none}.pagination{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media(forced-colors:active){*{scrollbar-color:auto}.chip,.panel,.capability{border:1px solid CanvasText}a,button{forced-color-adjust:auto}}
@media print{.rail,.topbar,.status,button,.pagination,.notes{display:none}.shell,.columns{display:block}.content{padding:0}.panel,.rule{break-inside:avoid}body{background:white}.source pre{white-space:pre-wrap;background:white;color:black;max-height:none}}

<body>
<a class="skip" href="#main">Ir para o conteúdo</a>
<div class="shell">
<aside class="rail"><div class="brand"><svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><circle cx="18" cy="18" r="15" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="18" r="5" stroke="currentColor" stroke-width="2"/><path d="M4 14l9 3m19-3l-9 3m-5 6v10" stroke="currentColor" stroke-width="3"/></svg>Volante</div><div class="project-block"><p class="eyebrow">Centaur / projeto</p><div class="project-name" id="project"></div></div><nav aria-label="Navegação principal" id="navigation"></nav><div class="rail-footer"><p>Seu sistema, por dentro.</p><p class="muted">Comportamento → código → evidência.</p><p id="snapshot"></p></div></aside>
<div class="main"><header class="topbar"><div class="search"><label class="sr-only" for="search">Buscar no visor</label><input id="search" type="search" placeholder="Buscar comportamento, regra ou arquivo…" autocomplete="off"><button id="clear" onclick="clearSearch()" aria-label="Limpar busca" hidden>×</button></div><div class="filter"><label class="small" for="scope">Módulo</label><select id="scope"></select></div></header><main id="main" class="content" tabindex="-1"></main></div>
</div><div id="feedback" class="status" role="status" aria-live="polite"></div>
<noscript><p>Ative JavaScript para navegar neste visor local. Os contratos e specs continuam disponíveis em .centaur/.</p></noscript>
<script id="volante-data" type="application/json">{{DATA}}</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('volante-data').textContent);
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const routes=[['overview','Visão geral','◉'],['contracts','Contratos','◇'],['code','Código','</>'],['evidence','Evidências','✓'],['next','Próximos passos','→'],['specs','Specs','≡'],['documents','Documentos','▤']];
const rules=D.contracts.flatMap(c=>c.rules);
const deliveryNames={local:'Local',integrated:'Integrada',published:'Publicada'};
let state=readRoute();let visible=18;let noteTimer;let feedbackTimer;
function readRoute(){const p=new URLSearchParams(location.hash.slice(1));return{view:p.get('view')||'overview',id:p.get('id')||'',q:p.get('q')||'',scope:p.get('scope')||''};}
function url(view,id='',extra={}){const p=new URLSearchParams({...state,...extra,view,id});for(const [k,v]of [...p])if(!v)p.delete(k);return '#'+p.toString();}
function notify(message){$('feedback').textContent=message;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>$('feedback').textContent='',6000);}
function chip(text){const tone=['aprovada','implementada','Integrada','Publicada','approved'].includes(text)?'ok':['falhou','Bloqueada'].includes(text)?'bad':['desatualizada','parcial','draft','Bloqueada'].includes(text)?'warn':'';return `<span class="chip ${tone}">${esc(({approved:'Aprovado',draft:'Rascunho',retired:'Retirado'})[text]||text)}</span>`;}
function matches(item){return(!state.scope||item.scope===state.scope)&&(!state.q||JSON.stringify(item).toLocaleLowerCase('pt-BR').includes(state.q.toLocaleLowerCase('pt-BR')));}
function contracts(){return D.contracts.filter(matches);}
function selectedRules(){return rules.filter(matches);}
function ruleLink(r,label){return `<a href="${esc(url('contract',r.contract,{rule:r.id}))}">${esc(label||r.description)}</a>`;}
function title(name,description,action=''){return `<div class="heading"><div><p class="eyebrow">${esc(D.project)} / visor do sistema</p><h1>${esc(name)}</h1><p class="muted">${esc(description)}</p></div>${action}</div>`;}
function empty(heading,body){return `<div class="empty"><h3>${esc(heading)}</h3><p class="muted">${esc(body)}</p></div>`;}
function sliced(items,render){return items.slice(0,visible).map(render).join('')+(items.length>visible?`<div class="pagination"><span>${visible} de ${items.length} registros</span><button data-more>Mostrar mais 18</button></div>`:'');}
function source(s){return `<details class="source"><summary><span class="mono">${esc(s.path)}:${s.start}–${s.end}</span> · ${esc(s.role)}</summary>${s.code?`<pre><code>${esc(s.code.split('\n').map((l,i)=>`${String(s.start+i).padStart(4,' ')}  ${l}`).join('\n'))}</code></pre>`:''}<div class="source-meta">${esc(s.warning||'Trecho capturado na geração do visor.')} ${s.sha256?`<br><span class="mono">SHA-256 ${esc(s.sha256.slice(0,16))}…</span>`:''}</div></details>`;}
function trace(r){return `<div class="trace"><div><small>IMPLEMENTAÇÃO</small><strong>${esc(r.implementation)}</strong></div><div><small>VERIFICAÇÃO</small>${chip(r.verification)}</div><div><small>ENTREGA REGISTRADA</small><strong>${esc(deliveryNames[r.delivery.stage])}</strong></div></div>`;}
function evidence(e){return `<div class="evidence">${chip(e.verification)} <span class="small muted">${esc(e.method)} · ${esc(formatDate(e.at))}</span><p><strong>${esc(e.summary)}</strong></p><p>${esc(e.reference)}</p>${e.command?`<pre>${esc(Array.isArray(e.command)?e.command.join(' '):e.command)}</pre>`:''}<details><summary class="small">Fontes verificadas e identificação</summary><p class="mono">${esc(e.id)}<br>${esc(e.contract)} / ${esc(e.rule)}<br>Revisão: ${esc(e.revision||'Não registrada')}</p>${Object.entries(e.files).map(([p,h])=>`<p class="mono">${esc(p)}<br>${esc(h)}</p>`).join('')}</details></div>`;}
function formatDate(value){const d=new Date(value);return Number.isNaN(d.getTime())?value:new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short',timeZoneName:undefined}).format(d);}
function overview(){const cs=contracts(),rs=selectedRules();return title('O que o sistema faz','Explore o molde definido, a realização no código e o que falta comprovar.')+`<div class="summary-line"><div><strong>${cs.length}</strong><span>contratos</span></div><div><strong>${rs.filter(r=>r.implementation==='implementada').length}/${rs.length}</strong><span>regras implementadas</span></div><div><strong>${rs.filter(r=>r.verification==='aprovada').length}/${rs.length}</strong><span>regras com evidência atual</span></div></div><div class="columns"><div><section class="panel"><div class="section-head"><h2>Mapa de capacidades</h2><span class="small muted">Selecione para aprofundar</span></div><div class="module-grid">${D.scopes.filter(s=>!state.scope||state.scope===s.id).map(s=>{const moduleContracts=cs.filter(c=>c.scope===s.id);return `<div class="module"><p class="eyebrow">Módulo</p><h3>${esc(s.id)}</h3><p class="small muted">${esc(s.code)} · ${esc(s.owner)}</p>${moduleContracts.map(c=>`<a class="capability" href="${esc(url('contract',c.id))}"><strong>${esc(c.title)} ↗</strong><small>${c.rules.length} regras · ${c.rules.filter(r=>r.verification==='aprovada').length} verificadas</small><div class="chips">${chip(c.status)}${c.rules.some(r=>r.verification==='desatualizada')?chip('desatualizada'):''}</div></a>`).join('')||'<p class="small muted">Nenhum contrato correspondente. Specs existentes continuam acessíveis.</p>'}</div>`;}).join('')}</div></section><section class="panel"><div class="section-head"><h2>Trabalho em foco</h2><a href="${esc(url('next'))}" class="small">Ver próximos passos →</a></div>${rs.length?rs.filter(r=>r.next!=='Observar funcionamento').slice(0,5).map(r=>`<div class="action">${ruleLink(r)}<p>${esc(r.next)}</p><div class="chips">${chip(r.implementation)}${chip(r.verification)}</div></div>`).join('')||'<p>Regras publicadas. Acompanhe os sinais definidos no contrato.</p>':empty('O molde ainda não foi registrado','Use centaur-driven-spec para definir o primeiro contrato. O código existente não será declarado validado automaticamente.')}</section></div><aside><section class="panel"><p class="eyebrow">Sua direção</p><h2>Decisões abertas</h2>${cs.some(c=>c.decisions?.length)?cs.flatMap(c=>(c.decisions||[]).map(d=>`<div class="action"><a href="${esc(url('contract',c.id))}">${esc(c.title)}</a><p>${esc(d)}</p></div>`)).join(''):'<p class="muted small">Nenhuma decisão aberta registrada. Isso não comprova que todos os requisitos foram definidos.</p>'}</section>${notesPanel()}</aside></div>`;}
function notesPanel(){return `<section class="panel notes"><p class="eyebrow">Caderno de direção</p><label for="notes" class="label">Suas notas</label><textarea id="notes" placeholder="O que deseja esclarecer ou mudar?"></textarea><p id="note-help" class="note-help">Salvas neste navegador. Não alteram contratos nem enviam tarefas à IA.</p><button data-export>Exportar contexto para a IA</button></section>`;}
function contractList(){const cs=contracts();return title('Contratos','Comportamentos e limites que orientam a implementação.')+`<section class="panel">${cs.length?sliced(cs,c=>`<article class="rule"><span class="mono rule-id">${esc(c.id)} @ ${c.version} · ${esc(c.scope)}</span><h2><a href="${esc(url('contract',c.id))}">${esc(c.title)}</a></h2><p>${esc(c.intent)}</p><div class="chips">${chip(c.status)}<span class="chip">${c.rules.length} regras</span>${c.draft_versions.length?`<span class="chip warn">Rascunhos: ${esc(c.draft_versions.join(', '))}</span>`:''}</div></article>`):empty('Nenhum contrato encontrado','Ajuste a busca ou registre o comportamento desejado com centaur-driven-spec.')}</section>`;}
function contractDetail(){const c=D.contracts.find(x=>x.id===state.id);if(!c)return title('Contrato não encontrado','O registro pode ter sido removido ou não estar neste snapshot.')+`<a href="${esc(url('contracts'))}">Voltar aos contratos</a>`;return `<a class="back" href="${esc(url('contracts'))}">← Contratos</a>`+title(c.title,c.intent,`<button class="primary" data-export>Exportar contexto para a IA</button>`)+`<div class="chips" style="margin-bottom:24px">${chip(c.status)}<span class="chip">${esc(c.id)} @ ${c.version}</span><span class="chip">${esc(c.scope)}</span>${c.draft_versions.length?`<span class="chip warn">Rascunhos disponíveis: ${esc(c.draft_versions.join(', '))}</span>`:''}</div><div class="columns"><section class="panel">${c.rules.map(r=>`<article class="rule" id="rule-${esc(r.id)}"><span class="mono rule-id">${esc(r.key)}</span><h2>${esc(r.description)}</h2><p class="eyebrow">Critérios de aceite</p><ul>${r.acceptance.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${trace(r)}${r.issues.length?`<div class="notice">${r.issues.map(esc).join('<br>')}</div>`:''}<details><summary>Código relacionado · ${r.sources.length} fontes</summary>${r.sources.map(source).join('')||'<p class="muted small">Nenhuma fonte vinculada. A IA precisa localizar e conferir a implementação.</p>'}</details><details style="margin-top:14px"><summary>Evidências · ${r.evidence.length} registros</summary>${r.evidence.map(evidence).join('')||'<p class="muted small">Sem evidência registrada para esta regra.</p>'}</details>${r.delivery.reference?`<details style="margin-top:14px"><summary>Registro de entrega</summary><p class="small">${esc(r.delivery.reference)}<br>Revisão: <code>${esc(r.delivery.revision)}</code><br>${esc(formatDate(r.delivery.at))}</p></details>`:''}<p class="rule-footer"><strong>Próximo passo:</strong> ${esc(r.next)}${r.waiting.length?`<br>Depende de: ${r.waiting.map(dep=>{const d=rules.find(x=>x.key===dep);return d?ruleLink(d,dep):esc(dep);}).join(', ')}`:''}</p></article>`).join('')}</section><aside><section class="panel"><h3>Limites do molde</h3>${list(c.boundaries,'Nenhum limite adicional registrado.')}<h3>Autonomia da IA</h3>${list(c.autonomy,'Autonomia não especificada.')}<h3>Decisões abertas</h3>${list(c.decisions,'Nenhuma decisão aberta registrada.')}</section><section class="panel"><h3>Origem e herança</h3><dl><div class="data-row"><dt>Fonte</dt><dd class="mono">${esc(c.path)}</dd></div><div class="data-row"><dt>Aprovação</dt><dd>${esc(c.approval?.reference||'Não registrada')}</dd></div><div class="data-row"><dt>Responsável</dt><dd>${esc(c.approval?.by||'Não registrado')}</dd></div></dl>${c.inherited.map(p=>`<details><summary>${esc(p.id)} · ${esc(p.title)}</summary>${list(p.boundaries,'')}${list(p.rules.map(r=>r.description),'')}</details>`).join('')||'<p class="small muted">Sem contratos herdados.</p>'}<details style="margin-top:18px"><summary>Versões do contrato · ${c.versions.length}</summary>${c.versions.map(v=>`<details style="margin:12px 0"><summary>Versão ${v.version} · ${esc(v.status)}</summary><pre class="document">${esc(JSON.stringify(v,null,2))}</pre></details>`).join('')}</details><p class="small muted">O código é uma captura local. Abra os arquivos atuais antes de editar.</p></section>${notesPanel()}</aside></div>`;}
function list(items,fallback){return items?.length?`<ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:fallback?`<p class="small muted">${esc(fallback)}</p>`:'';}
function codeView(){const rs=selectedRules().filter(r=>r.sources.length);return title('Código com propósito','Veja os trechos vinculados às regras e entenda por que existem.')+`<section class="panel">${rs.length?sliced(rs,r=>`<article class="rule"><span class="mono rule-id">${esc(r.key)}</span><h2>${ruleLink(r)}</h2>${r.sources.map(source).join('')}</article>`):empty('Nenhuma fonte correspondente','Vincule arquivos e intervalos de linhas ao estado de uma regra. O visor não incorpora o repositório inteiro.')}</section>`;}
function evidenceView(){const rs=selectedRules().filter(r=>r.evidence.length);return title('O que foi comprovado','Evidências são conferidas contra o contrato e os arquivos no momento da geração.')+`<section class="panel">${rs.length?sliced(rs,r=>`<article class="rule"><h2>${ruleLink(r)}</h2>${r.evidence.map(evidence).join('')}</article>`):empty('Sem evidências correspondentes','Execute a verificação do comportamento e registre as fontes verificadas. Um checklist marcado não comprova funcionamento.')}</section>`;}
function nextView(){const rs=selectedRules();return title('Próximos passos','A diferença entre o molde desejado e o estado comprovado orienta a execução.')+`<section class="panel">${rs.length?sliced(rs,r=>`<article class="rule"><span class="mono rule-id">${esc(r.key)}</span><h2>${esc(r.next)}</h2><p>${ruleLink(r)}</p>${trace(r)}${r.waiting.length?`<p class="small">Dependências: ${esc(r.waiting.join(', '))}</p>`:''}${r.issues.length?`<p class="small">${esc(r.issues.join('; '))}</p>`:''}</article>`):empty('Ainda não há próximos passos derivados','Registre contratos e o estado das regras para que as lacunas apareçam aqui.')}</section>`;}
function specsView(){const specs=D.specs.filter(matches);return title('Specs e entregas','Planejamentos existentes preservados. Checklist e evidência têm significados diferentes.')+`<section class="panel">${specs.length?sliced(specs,s=>`<article class="rule"><span class="mono rule-id">${esc(s.id)}</span><h2>${esc(s.title)}</h2><div class="chips">${chip(s.status)}<span class="chip">${s.tasks.filter(t=>t.done).length}/${s.tasks.length} tasks marcadas</span></div><p class="small muted">Contrato: ${esc(s.contract||'Sem vínculo; estado de verificação desconhecido')}</p><ul class="row-list">${s.tasks.map(t=>`<li><span aria-label="${t.done?'Marcada como concluída':'Pendente'}">${t.done?'✓':'○'}</span> ${esc(t.title)}</li>`).join('')}</ul><details style="margin-top:18px"><summary>Ler spec completa</summary><pre class="document">${esc(s.body)}</pre></details></article>`):empty('Nenhuma spec correspondente','Specs dos diretórios configurados em workspace.json aparecem aqui.')}</section>`;}
function documentsView(){const ds=D.documents.filter(d=>!state.q||JSON.stringify(d).toLocaleLowerCase('pt-BR').includes(state.q.toLocaleLowerCase('pt-BR')));return title('Documentos do sistema','Fluxos, perspectivas e decisões registrados em docs/system. Documentos não são prova de implementação.')+`<section class="panel">${ds.length?sliced(ds,d=>`<article class="rule"><h2>${esc(d.title)}</h2><p class="mono muted">${esc(d.path)}</p><details><summary>Ler documento</summary><pre class="document">${esc(d.body)}</pre></details></article>`):empty('Nenhum documento correspondente','Use Graphify para manter fluxos e perspectivas com fontes confirmadas.')}</section>`;}
function render(){document.title=`${routes.find(x=>x[0]===state.view)?.[1]||'Contrato'} · Volante · ${D.project}`;$('search').value=state.q;$('clear').hidden=!state.q;$('scope').value=state.scope;$('navigation').innerHTML=routes.map(([v,t,i])=>`<a href="${esc(url(v))}" ${state.view===v||(v==='contracts'&&state.view==='contract')?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${esc(i)}</span>${esc(t)}</a>`).join('');const view=({overview,contracts:contractList,contract:contractDetail,code:codeView,evidence:evidenceView,next:nextView,specs:specsView,documents:documentsView})[state.view];$('main').innerHTML=(D.warnings.length?`<div class="notice"><details><summary>${D.warnings.length} inconsistência(s) nos registros</summary><ul>${D.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></details></div>`:'')+(view?view():title('Visão não encontrada','Selecione uma seção no menu.'))+`<p class="footer-note">Snapshot de ${esc(formatDate(D.generated_at))} · revisão ${esc(D.revision?.slice(0,12)||'não disponível')}${D.dirty?' · com alterações locais':''}. Não acompanha alterações em tempo real. Regere o Volante após mudanças.<br>As evidências registram verificações específicas; não garantem ausência de bugs. Entrega reflete o registro da integração/publicação.</p>`;bindNotes();}
function storageKey(){return 'centaur-notes:'+location.pathname.replace(/(?:volante|andamento)\.html$/,'andamento.html');}
let localNotes='';
try{localNotes=localStorage.getItem(storageKey())||'';}catch(_){/* Page stays usable without browser storage. */}
function bindNotes(){const notes=$('notes');if(!notes)return;notes.value=localNotes;const grow=()=>{notes.style.height='auto';notes.style.height=Math.max(140,notes.scrollHeight)+'px';};grow();notes.addEventListener('input',()=>{localNotes=notes.value;grow();try{localStorage.setItem(storageKey(),localNotes);$('note-help').textContent='Salvas neste navegador. Não alteram contratos nem enviam tarefas à IA.';}catch(_){$('note-help').textContent='Armazenamento indisponível. Exporte as notas antes de fechar.';}});try{localStorage.getItem(storageKey());}catch(_){$('note-help').textContent='Armazenamento indisponível. Exporte as notas antes de fechar.';}}
function downloadContext(){const cs=state.view==='contract'?D.contracts.filter(c=>c.id===state.id):contracts();const text=['# Direção para a IA — '+D.project,'','Snapshot: '+D.generated_at,'Revisão: '+(D.revision||'não disponível'),'','## Minhas notas',localNotes||'(sem notas)','',...cs.flatMap(c=>['## '+c.id+' @ '+c.version+' — '+c.title,c.intent,'Limites: '+(c.boundaries||[]).join('; '),'Autonomia: '+(c.autonomy||[]).join('; '),'Decisões abertas: '+(c.decisions||[]).join('; '),...c.rules.flatMap(r=>['','### '+r.key+' — '+r.description,'Aceite: '+r.acceptance.join('; '),'Estado: '+r.implementation+' / '+r.verification+' / '+deliveryNames[r.delivery.stage],'Próximo passo: '+r.next,'Fontes: '+r.sources.map(s=>s.path+':'+s.start+'-'+s.end).join(', '),'Evidências: '+r.evidence.map(e=>e.id).join(', ')])]),'','Confira fontes atuais e contratos antes de agir. Esta exportação não altera aprovações nem concede novas permissões.'].join('\n');const blob=new Blob([text],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='volante-direcao.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('Contexto exportado. Envie o arquivo à IA com sua instrução.');}
$('project').textContent=D.project;$('snapshot').textContent='Snapshot · '+formatDate(D.generated_at);$('scope').innerHTML='<option value="">Todos os módulos</option>'+D.scopes.map(s=>`<option value="${esc(s.id)}">${esc(s.id)}</option>`).join('');
function updateFilters(){state.q=$('search').value;state.scope=$('scope').value;visible=18;history.replaceState(null,'',url(state.view,state.id));render();}
$('search').addEventListener('input',e=>{if(!e.isComposing)updateFilters();});$('search').addEventListener('compositionend',updateFilters);function clearSearch(){$('search').value='';updateFilters();$('search').focus();}$('scope').addEventListener('change',updateFilters);
window.addEventListener('hashchange',()=>{if(location.hash==='#main'){ $('main').focus();return;}state=readRoute();visible=18;render();$('main').focus({preventScroll:true});const rid=new URLSearchParams(location.hash.slice(1)).get('rule');if(rid)document.getElementById('rule-'+rid)?.scrollIntoView({block:'start'});else window.scrollTo(0,0);});
document.addEventListener('click',e=>{if(e.target.closest('[data-more]')){visible+=18;render();}if(e.target.closest('[data-export]'))downloadContext();});
render();
</script>
</body>
