<div class="main"><header class="topbar"><form id="search-form" class="search" novalidate><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><label class="sr-only" for="search">Buscar no visor</label><input id="search" type="search" placeholder="Buscar comportamento, regra ou arquivo…" autocomplete="off"><button id="clear" type="submit" aria-label="Limpar busca" hidden>×</button></form><div class="filter"><label class="small" for="scope">Módulo</label><select id="scope"></select></div></header><main id="main" class="content" tabindex="-1"></main></div>

<script>
'use strict';
let D=JSON.parse(document.getElementById('volante-data').textContent);
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const routes=[['overview','Visão geral','◉'],['contracts','Contratos','◇'],['usecases','Casos de uso','↪'],['code','Código','</>'],['evidence','Evidências','✓'],['next','Próximos passos','→'],['specs','Specs','≡'],['documents','Documentos','▤'],['agents','Agentes','◎']];
let rules=D.contracts.flatMap(c=>c.rules);
const deliveryNames={local:'Local',integrated:'Integrada',published:'Publicada'};
const host=typeof acquireVsCodeApi==='function'?acquireVsCodeApi():null;let agentProfiles=[];let runningAgents=[];let drafts={};let selectedNode='';let selectedCase='';let requestBusy=false;let state=readRoute();let visible=18;let noteTimer;let feedbackTimer;
function readRoute(){const p=new URLSearchParams(location.hash.slice(1));return{view:p.get('view')||'overview',id:p.get('id')||'',q:p.get('q')||'',scope:p.get('scope')||''};}
function url(view,id='',extra={}){const p=new URLSearchParams({...state,...extra,view,id});for(const [k,v]of [...p])if(!v)p.delete(k);return '#'+p.toString();}
function notify(message){$('feedback').textContent=message;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>$('feedback').textContent='',6000);}
function chip(text){const tone=['aprovada','implementada','Integrada','Publicada','approved'].includes(text)?'ok':['falhou','Bloqueada'].includes(text)?'bad':['desatualizada','parcial','draft','Bloqueada'].includes(text)?'warn':'';return `<span class="chip ${tone}">${esc(({approved:'Aprovado',draft:'Rascunho',retired:'Retirado'})[text]||text)}</span>`;}
function matches(item){return(!state.scope||item.scope===state.scope)&&(!state.q||JSON.stringify(item).toLocaleLowerCase('pt-BR').includes(state.q.toLocaleLowerCase('pt-BR')));}
function contracts(){return D.contracts.filter(matches);}
function selectedRules(){return rules.filter(matches);}
function ruleLink(r,label){return `<a href="${esc(url('contract',r.contract,{rule:r.id}))}">${esc(label||r.description)}</a>`;}
function title(name,description,action=''){return `<div class="heading"><div><p class="eyebrow">Seu sistema / ${esc(D.project)}</p><h1>${esc(name)}</h1><p class="muted">${esc(description)}</p></div>${action}</div>`;}
function empty(heading,body){return `<div class="empty"><h3>${esc(heading)}</h3><p class="muted">${esc(body)}</p></div>`;}
function sliced(items,render){return items.slice(0,visible).map(render).join('')+(items.length>visible?`<div class="pagination"><span>${visible} de ${items.length} registros</span><button data-more>Mostrar mais 18</button></div>`:'');}
function source(s){return `<details class="source"><summary><span class="mono">${esc(s.path)}:${s.start}–${s.end}</span> · ${esc(s.role)}</summary>${s.code?`<pre><code>${esc(s.code.split('\n').map((l,i)=>`${String(s.start+i).padStart(4,' ')}  ${l}`).join('\n'))}</code></pre>`:''}<div class="source-meta">${esc(s.warning||'Trecho capturado na geração do visor.')} ${s.sha256?`<br><span class="mono">SHA-256 ${esc(s.sha256.slice(0,16))}…</span>`:''}</div></details>`;}
function trace(r){return `<div class="trace"><div><small>IMPLEMENTAÇÃO</small><strong>${esc(r.implementation)}</strong></div><div><small>VERIFICAÇÃO</small>${chip(r.verification)}</div><div><small>ENTREGA REGISTRADA</small><strong>${esc(deliveryNames[r.delivery.stage])}</strong></div></div>`;}
function evidence(e){return `<div class="evidence">${chip(e.verification)} <span class="small muted">${esc(e.method)} · ${esc(formatDate(e.at))}</span><p><strong>${esc(e.summary)}</strong></p><p>${esc(e.reference)}</p>${e.command?`<pre>${esc(Array.isArray(e.command)?e.command.join(' '):e.command)}</pre>`:''}<details><summary class="small">Fontes verificadas e identificação</summary><p class="mono">${esc(e.id)}<br>${esc(e.contract)} / ${esc(e.rule)}<br>Revisão: ${esc(e.revision||'Não registrada')}</p>${Object.entries(e.files).map(([p,h])=>`<p class="mono">${esc(p)}<br>${esc(h)}</p>`).join('')}</details></div>`;}
function formatDate(value){const d=new Date(value);return Number.isNaN(d.getTime())?value:new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short',timeZoneName:undefined}).format(d);}
function icon(name){
  const paths={overview:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',contracts:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',code:'<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-14-2 18"/>',evidence:'<path d="m8 12 3 3 5-6"/><circle cx="12" cy="12" r="9"/>',next:'<path d="M4 12h16m-6-6 6 6-6 6"/>',specs:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/>',usecases:'<path d="M3 5h6v5h6v5h6M6 5v8h6m-6 0v6h6"/>',agents:'<path d="M12 3v4M4 10h16M5 10v9h5v-5m9-4v9h-5v-5"/>',documents:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/>',module:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M7 10v7h7"/>',arrow:'<path d="M6 18 18 6M6 6h12v12"/>'};
  return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.next}</svg>`;
}
function overview(){
  const cs=contracts(),rs=selectedRules();
  const decisions=cs.flatMap(c=>(c.decisions||[]).map(d=>({c,d})));
  const groups=D.scopes.filter(s=>(!state.scope||state.scope===s.id)&&cs.some(c=>c.scope===s.id));
  const todo=rs.filter(r=>r.next!=='Observar funcionamento');
  return title('O que o sistema faz','Seu ponto de partida para entender, conferir e direcionar o código.',`<button class="primary" data-export>Exportar contexto para a IA</button>`)+`
  <div class="readout" aria-label="Resumo dos registros filtrados">
    <a href="${esc(url('contracts'))}"><div class="readout-icon">${icon('contracts')}</div><div><strong>${cs.length}</strong><span>contratos no molde</span></div></a>
    <a href="${esc(url('code'))}"><div class="readout-icon">${icon('code')}</div><div><strong>${rs.filter(r=>r.implementation==='implementada').length} <span>/ ${rs.length}</span></strong><span>regras implementadas</span></div></a>
    <a href="${esc(url('evidence'))}"><div class="readout-icon">${icon('evidence')}</div><div><strong>${rs.filter(r=>r.verification==='aprovada').length} <span>/ ${rs.length}</span></strong><span>com evidência atual</span></div></a>
  </div>
  <div class="columns"><div>
    <section class="panel map-panel"><div class="section-head"><div><h2>Mapa de capacidades</h2><p>Do comportamento ao código que o realiza.</p></div>${icon('module')}</div>
    <div class="module-grid">${groups.map(s=>`<div class="module"><div class="module-heading">${icon('module')}<div><h3>${esc(s.id)}</h3><p>${esc(s.owner)} · ${esc(s.code)}</p></div></div>${cs.filter(c=>c.scope===s.id).map(c=>`<a class="capability" href="${esc(url('contract',c.id))}"><div class="card-meta"><span>${esc(c.id)} @ ${c.version}</span>${icon('arrow')}</div><strong>${esc(c.title)}</strong><p class="capability-intent">${esc(c.intent)}</p>${chip(c.status)}${c.rules.some(r=>r.verification==='desatualizada')?chip('desatualizada'):''}<div class="rule-dots" aria-hidden="true">${c.rules.map(r=>`<span class="rule-dot ${r.verification==='aprovada'?'ok':r.implementation==='parcial'?'warn':''}"></span>`).join('')}</div><small>${c.rules.filter(r=>r.verification==='aprovada').length} de ${c.rules.length} regras com evidência atual</small></a>`).join('')}</div>`).join('')||empty('Nenhum contrato neste recorte','Ajuste os filtros ou registre o primeiro contrato para explorar suas capacidades.')}</div>
    <p class="map-caption"><span class="legend"><i></i>Evidência atual</span><span class="legend"><i class="partial"></i>Implementação parcial</span><span class="legend"><i class="unknown"></i>Sem evidência atual</span><br>Cada segmento representa uma regra. Abra uma capacidade para inspecionar.</p></section>
    <section class="panel"><div class="section-head"><div><h2>Trabalho em foco</h2><p>O que ainda separa intenção e realização.</p></div><a href="${esc(url('next'))}" class="small">Ver todos →</a></div><div>${rs.length?todo.slice(0,5).map(r=>`<div class="work-row">${icon('next')}<div>${ruleLink(r)}<p>${esc(r.next)}</p></div><div class="chips">${chip(r.implementation)}</div></div>`).join('')||'<p class="muted">Regras publicadas. Acompanhe os sinais definidos no contrato.</p>':empty('O molde ainda não foi registrado','Defina o primeiro contrato para acompanhar o trabalho.')}</div></section>
  </div><aside>
    <section class="panel decision-panel"><p class="eyebrow">Sua direção · ${decisions.length} ${decisions.length===1?'decisão':'decisões'}</p><h2>${decisions.length?'O próximo avanço precisa de você.':'Decisões abertas'}</h2>${decisions.length?decisions.map(({c,d})=>`<div class="action"><p>${esc(d)}</p><a class="decision-link" href="${esc(url('contract',c.id))}">Revisar ${esc(c.id)} ${icon('next')}</a></div>`).join(''):'<p class="muted small">Nenhuma decisão aberta registrada. Confira os limites antes de ampliar o escopo.</p>'}</section>${notesPanel()}
  </aside></div>`;
}
function notesPanel(){return `<section class="panel notes"><p class="eyebrow">Caderno de direção</p><label for="notes" class="label">Suas notas</label><textarea id="notes" aria-describedby="note-help" placeholder="O que deseja esclarecer ou mudar?"></textarea><p id="note-help" class="note-help">Salvas neste navegador. Não alteram contratos nem enviam tarefas à IA.</p><button data-export>Exportar contexto para a IA</button></section>`;}
function contractList(){const cs=contracts();return title('Contratos','Escolha uma capacidade para ver as regras e os limites definidos por você.')+`<div class="compact-list">${cs.length?sliced(cs,c=>`<a class="compact-row" href="${esc(url('contract',c.id))}"><span class="compact-mark">${icon('contracts')}</span><span><strong>${esc(c.title)}</strong><small>${esc(c.intent)}</small><small class="mono">${esc(c.scope)} · ${esc(c.id)} @ ${c.version}</small></span><span class="compact-side">${chip(c.status)}<small>${c.rules.filter(r=>r.verification==='aprovada').length}/${c.rules.length} verificadas</small></span></a>`):empty('Nenhum contrato encontrado','Ajuste a busca ou registre o comportamento desejado.')}</div>`;}
function contractDetail(){const c=D.contracts.find(x=>x.id===state.id);if(!c)return title('Contrato não encontrado','O registro pode ter sido removido ou não estar neste snapshot.')+`<a href="${esc(url('contracts'))}">Voltar aos contratos</a>`;return `<a class="back" href="${esc(url('contracts'))}">← Contratos</a>`+title(c.title,c.intent)+`<div class="chips" style="margin-bottom:24px">${chip(c.status)}<span class="chip">${esc(c.id)} @ ${c.version}</span><span class="chip">${esc(c.scope)}</span></div><div class="columns"><section class="panel"><div class="section-head"><div><h2>Regras do comportamento</h2><p>O que precisa acontecer e como saber se aconteceu.</p></div></div>${c.rules.map(r=>`<article class="rule contract-rule" id="rule-${esc(r.id)}"><span class="mono rule-id">${esc(r.id)}</span><h2>${esc(r.description)}</h2><ul>${r.acceptance.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="chips">${chip(r.implementation)}${chip(r.verification)}${chip(deliveryNames[r.delivery.stage])}</div><p class="rule-footer"><strong>Próximo passo:</strong> ${esc(r.next)}</p><div class="rule-actions"><a href="${esc(url('code',r.sources[0]?.path||''))}">Ver código ${icon('next')}</a><a href="${esc(url('evidence',r.key))}">Ver evidências ${icon('next')}</a></div></article>`).join('')}</section><aside><section class="panel decision-panel"><p class="eyebrow">Limites definidos por você</p><h3>Não alterar</h3>${list(c.boundaries,'Nenhum limite adicional registrado.')}<h3>Autonomia da IA</h3>${list(c.autonomy,'Autonomia não especificada.')}<h3>Decisões abertas</h3>${list(c.decisions,'Nenhuma decisão aberta registrada.')}</section><section class="panel"><h3>Explorar</h3><p><a href="${esc(url('usecases',c.id))}">Fluxo do caso de uso →</a></p><details><summary>Histórico e origem</summary><p class="small mono">${esc(c.path)}</p><p class="small">${esc(c.approval?.reference||'Aprovação não registrada')}</p>${c.inherited.map(i=>`<p class="small">Herda ${esc(i.id)}: ${esc(i.title)}</p>`).join('')}<details><summary>${c.versions.length} versões</summary><pre class="document">${esc(JSON.stringify(c.versions,null,2))}</pre></details></details></section>${notesPanel()}</aside></div>`;}
function list(items,fallback){return items?.length?`<ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:fallback?`<p class="small muted">${esc(fallback)}</p>`:'';}
function codeView(){const rs=selectedRules().filter(r=>r.sources.length);const items=new Map();for(const r of rs){for(const src of r.sources){if(!items.has(src.path))items.set(src.path,{source:src,rules:[]});items.get(src.path).rules.push(r);}}const current=state.id?items.get(state.id):null;const fileView=x=>`<a class="compact-row" href="${esc(url('code',x.source.path))}"><span class="compact-mark">${icon('code')}</span><span><strong class="mono">${esc(x.source.path)}</strong><small>${x.rules.map(r=>esc(r.description)).join(' · ')}</small></span><span class="compact-side"><small>${x.rules.length} ${x.rules.length===1?'regra':'regras'}</small></span></a>`;return title('Código','Arquivos vinculados a comportamentos do contrato. Abra um arquivo para conferir o trecho capturado.')+(current?`<a class="back" href="${esc(url('code'))}">← Todos os arquivos</a><section class="panel"><p class="eyebrow">Arquivo vinculado</p><h2 class="mono">${esc(current.source.path)}</h2>${current.rules.map(r=>`<p class="small">${ruleLink(r,r.key)} · ${esc(r.description)}</p>`).join('')}${current.rules.flatMap(r=>r.sources.filter(src=>src.path===current.source.path).map(source)).join('')}<p class="muted small">Prévia do snapshot. Confira o arquivo atual no editor antes de editar.</p></section>`:`<div class="compact-list">${items.size?sliced([...items.values()],fileView):empty('Nenhum arquivo vinculado','Vincule o código às regras do contrato para vê-lo aqui.')}</div>`);}
function evidenceView(){const rs=selectedRules().filter(r=>r.evidence.length&&(!state.id||r.key===state.id));return title('O que foi comprovado','Evidências são conferidas contra o contrato e os arquivos no momento da geração.')+`<section class="panel">${rs.length?sliced(rs,r=>`<article class="rule"><h2>${ruleLink(r)}</h2>${r.evidence.map(evidence).join('')}</article>`):empty('Sem evidências correspondentes','Execute a verificação do comportamento e registre as fontes verificadas. Um checklist marcado não comprova funcionamento.')}</section>`;}
function nextView(){const rs=selectedRules();return title('Próximos passos','A diferença entre o molde desejado e o estado comprovado orienta a execução.')+`<section class="panel">${rs.length?sliced(rs,r=>`<article class="rule"><span class="mono rule-id">${esc(r.key)}</span><h2>${esc(r.next)}</h2><p>${ruleLink(r)}</p>${trace(r)}${r.waiting.length?`<p class="small">Dependências: ${esc(r.waiting.join(', '))}</p>`:''}${r.issues.length?`<p class="small">${esc(r.issues.join('; '))}</p>`:''}</article>`):empty('Ainda não há próximos passos derivados','Registre contratos e o estado das regras para que as lacunas apareçam aqui.')}</section>`;}
function specsView(){const specs=D.specs.filter(matches);return title('Specs e entregas','Planejamentos existentes preservados. Checklist e evidência têm significados diferentes.')+`<section class="panel">${specs.length?sliced(specs,s=>`<article class="rule"><span class="mono rule-id">${esc(s.id)}</span><h2>${esc(s.title)}</h2><div class="chips">${chip(s.status)}<span class="chip">${s.tasks.filter(t=>t.done).length}/${s.tasks.length} tasks marcadas</span></div><p class="small muted">Contrato: ${esc(s.contract||'Sem vínculo; estado de verificação desconhecido')}</p><ul class="row-list">${s.tasks.map(t=>`<li><span aria-label="${t.done?'Marcada como concluída':'Pendente'}">${t.done?'✓':'○'}</span> ${esc(t.title)}</li>`).join('')}</ul><details style="margin-top:18px"><summary>Ler spec completa</summary><pre class="document">${esc(s.body)}</pre></details></article>`):empty('Nenhuma spec correspondente','Specs dos diretórios configurados em workspace.json aparecem aqui.')}</section>`;}
function basicCase(c){const ns=[{id:'inicio',kind:'start',label:'Início',detail:''},...c.rules.slice(0,25).map((r,i)=>({id:'etapa'+(i+1),kind:'action',label:r.description.slice(0,120),detail:r.acceptance.join(' ').slice(0,500)})),{id:'fim',kind:'end',label:'Resultado',detail:''}];return {schema:1,contract:c.id,version:c.version,title:c.title,summary:c.intent,nodes:ns,edges:ns.slice(1).map((n,i)=>({from:ns[i].id,to:n.id,label:''}))};}
function activeCase(){const c=D.contracts.find(x=>x.id===state.id)||D.contracts.find(x=>x.status==='approved')||D.contracts[0];if(!c)return null;return {contract:c,case:drafts[c.id]||D.use_cases?.find(u=>u.contract===c.id)||basicCase(c)};}
function graph(flow){
 const nodes=flow.nodes.slice(0,32),byId=new Map(nodes.map(n=>[n.id,n]));
 const depth=new Map(),queue=[];for(const n of nodes.filter(n=>n.kind==='start')){depth.set(n.id,0);queue.push(n.id);}
 while(queue.length){const id=queue.shift();for(const e of flow.edges.filter(e=>e.from===id)){if(byId.has(e.to)&&!depth.has(e.to)){depth.set(e.to,depth.get(id)+1);queue.push(e.to);}}}
 let last=Math.max(0,...depth.values());for(const n of nodes)if(!depth.has(n.id))depth.set(n.id,++last);
 const levels=new Map();for(const n of nodes){const d=depth.get(n.id);if(!levels.has(d))levels.set(d,[]);levels.get(d).push(n);}
 const coords=new Map();let row=0;for(const [,group]of [...levels].sort((a,b)=>a[0]-b[0]))for(let i=0;i<group.length;i+=2){const pair=group.slice(i,i+2);pair.forEach((n,j)=>coords.set(n.id,{x:pair.length===1?224:j===0?26:420,y:36+row*124}));row++;}
 const height=Math.max(340,row*124+34);
 const edges=flow.edges.filter(e=>coords.has(e.from)&&coords.has(e.to)).map(e=>{const a=coords.get(e.from),b=coords.get(e.to),x1=a.x+152,y1=a.y+68,x2=b.x+152,y2=b.y;const up=y2<=y1;return `<path d="M${x1} ${y1} C${x1} ${up?y1+34:(y1+y2)/2},${x2} ${up?y2-34:(y1+y2)/2},${x2} ${y2-5}" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow)"/><text x="${(x1+x2)/2+12}" y="${up?y1+24:(y1+y2)/2}" class="edge-label">${esc(e.label)}</text>`}).join('');
 return `<div class="flow-scroll"><svg class="flow-svg" viewBox="0 0 752 ${height}" role="img" aria-label="Fluxo ${esc(flow.title)}"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1 1 5 4 1 7" fill="none" stroke="var(--muted)"/></marker></defs>${edges}${nodes.map(n=>{const pos=coords.get(n.id),active=selectedNode===n.id;return `<g class="flow-node ${active?'selected':''}" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="Editar passo ${esc(n.label)}"><rect x="${pos.x}" y="${pos.y}" width="304" height="68" rx="10"/><text x="${pos.x+16}" y="${pos.y+20}" class="node-kind">${esc(({start:'INÍCIO',end:'FIM',decision:'DECISÃO',action:'AÇÃO'})[n.kind])}</text><text x="${pos.x+16}" y="${pos.y+44}" class="node-label">${esc(n.label.length>35?n.label.slice(0,34)+'…':n.label)}</text></g>`}).join('')}</svg></div>`;
}
function casesView(){const set=activeCase();if(!set)return title('Casos de uso','Defina primeiro um contrato para criar um fluxo.');const {contract:c,case:flow}=set;const selected=flow.nodes.find(n=>n.id===selectedNode)||flow.nodes[0];const saved=!!D.use_cases?.find(u=>u.contract===c.id);return title('Casos de uso','Percorra a jornada, ajuste os passos e salve um JSON separado do contrato.')+`<div class="case-tabs" role="navigation" aria-label="Casos de uso">${D.contracts.filter(x=>!state.scope||x.scope===state.scope).map(x=>`<a href="${esc(url('usecases',x.id))}" ${c.id===x.id?'aria-current="page"':''}>${esc(x.title)}</a>`).join('')}</div><div class="columns case-layout"><section class="panel"><p class="eyebrow">${saved?'Fluxo salvo':'Rascunho inicial gerado das regras'} · ${esc(c.id)} @ ${c.version}</p><h2>${esc(flow.title)}</h2><p class="muted">${esc(flow.summary)}</p>${graph(flow)}<p class="small muted">Fluxos gerados por IA são propostas editáveis. O JSON salvo não altera a aprovação do contrato.</p></section><aside><section class="panel"><h3>Editar fluxo</h3><label class="label" for="node-select">Passo selecionado</label><select id="node-select">${flow.nodes.map(n=>`<option value="${esc(n.id)}" ${n.id===selected.id?'selected':''}>${esc(n.label)}</option>`).join('')}</select><label class="label" for="node-label">Título</label><input id="node-label" maxlength="120" value="${esc(selected.label)}"><label class="label" for="node-kind">Tipo</label><select id="node-kind">${[['start','Início'],['action','Ação'],['decision','Decisão'],['end','Fim']].map(([v,t])=>`<option value="${v}" ${v===selected.kind?'selected':''}>${t}</option>`).join('')}</select><label class="label" for="node-detail">Descrição</label><textarea id="node-detail" maxlength="500">${esc(selected.detail||'')}</textarea><div class="case-actions"><button data-update-node>Aplicar ao passo</button><button data-add-node>Adicionar passo</button><button data-remove-node ${flow.nodes.length<=1?'disabled':''}>Remover passo</button></div><details><summary>Conexões · ${flow.edges.length}</summary><div class="edge-editor"><label for="edge-from">De</label><select id="edge-from">${flow.nodes.map(n=>`<option value="${esc(n.id)}">${esc(n.label)}</option>`).join('')}</select><label for="edge-to">Para</label><select id="edge-to">${flow.nodes.map(n=>`<option value="${esc(n.id)}">${esc(n.label)}</option>`).join('')}</select><label for="edge-label">Condição</label><input id="edge-label" maxlength="80" placeholder="Ex.: Sim"><button data-add-edge>Adicionar conexão</button>${flow.edges.map((e,i)=>`<div class="edge-item"><span>${esc(e.from)} → ${esc(e.to)} ${esc(e.label)}</span><button data-remove-edge="${i}" aria-label="Remover conexão ${i+1}">×</button></div>`).join('')}</div></details></section><section class="panel"><h3>Salvar e gerar</h3><button class="primary wide" data-save-case>Salvar JSON no projeto</button><button class="wide" data-generate-case ${host?'':'disabled title="Disponível no VS Code"'}>Gerar fluxo com IA</button><p class="small muted">${host?'O modelo disponível no VS Code propõe um novo rascunho. Você revisa e salva.':'No navegador, o JSON é baixado. Abra a extensão no VS Code para geração com IA e gravação direta.'}</p></section></aside></div>`;}
function agentsView(){const eligible=rules.filter(r=>r.eligible&&!r.waiting.length&&!r.issues.length);return title('Agentes','Distribua regras elegíveis entre executores locais. Cada agente trabalha em um worktree separado.')+`<div class="columns"><section class="panel"><h2>Nova execução</h2><p class="muted">Escolha até quatro regras diferentes para iniciar agentes em paralelo. Revise cada branch antes de integrar.</p><label class="label" for="agent-profile">Perfil de agente</label><select id="agent-profile">${agentProfiles.map(p=>`<option value="${esc(p.id)}">${esc(p.label)}</option>`).join('')}</select><button class="configure-button" data-configure-agents ${host?'':'disabled'}>Configurar perfis no VS Code</button><fieldset class="agent-rules"><legend>Regras elegíveis</legend>${eligible.map(r=>`<label><input type="checkbox" value="${esc(r.key)}"><span><strong class="mono">${esc(r.key)}</strong><br>${esc(r.description)}</span></label>`).join('')||'<p class="muted small">Nenhuma regra liberada para execução. Resolva contratos, decisões e dependências.</p>'}</fieldset><label class="label" for="agent-instruction">Instrução para a equipe</label><textarea id="agent-instruction" placeholder="Qual resultado espera desta execução?"></textarea><button class="primary" data-start-agent ${host&&agentProfiles.length&&eligible.length?'':'disabled'}>Iniciar agentes selecionados</button><p class="small muted">${host?agentProfiles.length?'Execuções locais partem do último commit. Nenhum resultado é integrado automaticamente.':'Configure um perfil de agente para habilitar a execução.':'A execução de agentes está disponível no painel da extensão VS Code.'}</p></section><aside><section class="panel"><h2>Execuções nesta sessão</h2>${runningAgents.length?runningAgents.map(x=>`<div class="action"><strong>${esc(x.profile)} · ${esc(x.rule)}</strong><p>${esc(x.status)} · ${esc(x.branch)}</p><button data-stop-agent="${esc(x.id)}" ${x.status==='em execução'?'':'disabled'}>Interromper</button></div>`).join(''):'<p class="muted">Nenhum agente iniciado nesta sessão.</p>'}</section></aside></div>`;}
function getDraft(){const set=activeCase();if(!set)return null;if(!drafts[set.contract.id])drafts[set.contract.id]=JSON.parse(JSON.stringify(set.case));return drafts[set.contract.id];}
function caseChanged(){render();}
function caseAction(target){const flow=getDraft();if(!flow)return;const node=flow.nodes.find(n=>n.id===selectedNode)||flow.nodes[0];if(target.matches('[data-update-node]')){const name=$('node-label').value.trim();if(!name){notify('Informe o título do passo.');$('node-label').focus();return;}node.label=name;node.kind=$('node-kind').value;node.detail=$('node-detail').value;caseChanged();}
if(target.matches('[data-add-node]')){if(flow.nodes.length>=32){notify('Limite de 32 passos por fluxo.');return;}let i=flow.nodes.length+1;while(flow.nodes.some(n=>n.id==='passo'+i))i++;const id='passo'+i;flow.nodes.push({id,kind:'action',label:'Novo passo',detail:''});selectedNode=id;caseChanged();}
if(target.matches('[data-remove-node]')){if(flow.nodes.length<=1)return;flow.nodes=flow.nodes.filter(n=>n.id!==node.id);flow.edges=flow.edges.filter(e=>e.from!==node.id&&e.to!==node.id);selectedNode=flow.nodes[0].id;caseChanged();}
if(target.matches('[data-add-edge]')){const from=$('edge-from').value,to=$('edge-to').value,label=$('edge-label').value;if(from===to||flow.edges.length>=64||flow.edges.some(e=>e.from===from&&e.to===to&&e.label===label)){notify('Escolha passos diferentes e uma conexão nova.');return;}flow.edges.push({from,to,label});caseChanged();}
if(target.matches('[data-remove-edge]')){flow.edges.splice(Number(target.dataset.removeEdge),1);caseChanged();}}
function saveCase(){const set=activeCase();if(!set)return;const c=set.contract,flow=getDraft();if(!flow.nodes.some(n=>n.kind==='start')){notify('O fluxo precisa de um passo de início.');return;}if(host){host.postMessage({type:'saveCase',case:flow,expectedHash:D.use_cases?.find(x=>x.contract===c.id)?.file_hash||null});notify('Salvando JSON…');}else{const blob=new Blob([JSON.stringify(flow,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=c.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('JSON baixado. Salve em .centaur/use-cases/ no projeto.');}}
function documentsView(){const ds=D.documents.filter(d=>!state.q||JSON.stringify(d).toLocaleLowerCase('pt-BR').includes(state.q.toLocaleLowerCase('pt-BR')));return title('Documentos do sistema','Fluxos, perspectivas e decisões registrados em docs/system. Documentos não são prova de implementação.')+`<section class="panel">${ds.length?sliced(ds,d=>`<article class="rule"><h2>${esc(d.title)}</h2><p class="mono muted">${esc(d.path)}</p><details><summary>Ler documento</summary><pre class="document">${esc(d.body)}</pre></details></article>`):empty('Nenhum documento correspondente','Use Graphify para manter fluxos e perspectivas com fontes confirmadas.')}</section>`;}
function render(){document.title=`${routes.find(x=>x[0]===state.view)?.[1]||'Contrato'} · Volante · ${D.project}`;$('search').value=state.q;$('clear').hidden=!state.q;$('scope').value=state.scope;$('navigation').innerHTML=routes.map(([v,t,i])=>`<a href="${esc(url(v))}" ${state.view===v||(v==='contracts'&&state.view==='contract')?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon(v)}</span>${esc(t)}</a>`).join('');const view=({overview,contracts:contractList,contract:contractDetail,usecases:casesView,agents:agentsView,code:codeView,evidence:evidenceView,next:nextView,specs:specsView,documents:documentsView})[state.view];$('main').innerHTML=(D.warnings.length?`<div class="notice"><details><summary>${D.warnings.length} inconsistência(s) nos registros</summary><ul>${D.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></details></div>`:'')+(view?view():title('Visão não encontrada','Selecione uma seção no menu.'))+`<p class="footer-note">Snapshot de ${esc(formatDate(D.generated_at))} · revisão ${esc(D.revision?.slice(0,12)||'não disponível')}${D.dirty?' · com alterações locais':''}. Não acompanha alterações em tempo real. Regere o Volante após mudanças.<br>As evidências registram verificações específicas; não garantem ausência de bugs. Entrega reflete o registro da integração/publicação.</p>`;bindNotes();}
function storageKey(){return 'centaur-notes:'+location.pathname.replace(/(?:volante|andamento)\.html$/,'andamento.html');}
let localNotes='';
try{localNotes=localStorage.getItem(storageKey())||'';}catch(_){/* Page stays usable without browser storage. */}
function bindNotes(){const notes=$('notes');if(!notes)return;notes.value=localNotes;const grow=()=>{notes.style.height='auto';notes.style.height=Math.max(140,notes.scrollHeight)+'px';};grow();notes.addEventListener('input',()=>{localNotes=notes.value;grow();try{localStorage.setItem(storageKey(),localNotes);$('note-help').textContent='Salvas neste navegador. Não alteram contratos nem enviam tarefas à IA.';}catch(_){$('note-help').textContent='Armazenamento indisponível. Exporte as notas antes de fechar.';}});try{localStorage.getItem(storageKey());}catch(_){$('note-help').textContent='Armazenamento indisponível. Exporte as notas antes de fechar.';}}
function downloadContext(){const cs=state.view==='contract'?D.contracts.filter(c=>c.id===state.id):contracts();const text=['# Direção para a IA — '+D.project,'','Snapshot: '+D.generated_at,'Revisão: '+(D.revision||'não disponível'),'','## Minhas notas',localNotes||'(sem notas)','',...cs.flatMap(c=>['## '+c.id+' @ '+c.version+' — '+c.title,c.intent,'Limites: '+(c.boundaries||[]).join('; '),'Autonomia: '+(c.autonomy||[]).join('; '),'Decisões abertas: '+(c.decisions||[]).join('; '),...c.rules.flatMap(r=>['','### '+r.key+' — '+r.description,'Aceite: '+r.acceptance.join('; '),'Estado: '+r.implementation+' / '+r.verification+' / '+deliveryNames[r.delivery.stage],'Próximo passo: '+r.next,'Fontes: '+r.sources.map(s=>s.path+':'+s.start+'-'+s.end).join(', '),'Evidências: '+r.evidence.map(e=>e.id).join(', ')])]),'','Confira fontes atuais e contratos antes de agir. Esta exportação não altera aprovações nem concede novas permissões.'].join('\n');const blob=new Blob([text],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='volante-direcao.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('Contexto exportado. Envie o arquivo à IA com sua instrução.');}
$('project').textContent=D.project;$('snapshot').textContent='Snapshot · '+formatDate(D.generated_at);$('scope').innerHTML='<option value="">Todos os módulos</option>'+D.scopes.map(s=>`<option value="${esc(s.id)}">${esc(s.id)}</option>`).join('');
function updateFilters(){state=readRoute();state.q=$('search').value;state.scope=$('scope').value;visible=18;history.replaceState(null,'',url(state.view,state.id));render();}
$('search').addEventListener('input',e=>{if(!e.isComposing)updateFilters();});$('search').addEventListener('compositionend',updateFilters);function clearSearch(){$('search').value='';updateFilters();$('search').focus();}$('search-form').addEventListener('submit',e=>{e.preventDefault();clearSearch();});$('scope').addEventListener('change',updateFilters);
window.addEventListener('hashchange',()=>{if(location.hash==='#main'){ $('main').focus();return;}state=readRoute();visible=18;render();$('main').focus({preventScroll:true});const rid=new URLSearchParams(location.hash.slice(1)).get('rule');if(rid)document.getElementById('rule-'+rid)?.scrollIntoView({block:'start'});else window.scrollTo(0,0);});
document.addEventListener('click',e=>{const node=e.target.closest('[data-node]');if(node){selectedNode=node.dataset.node;render();}const caseButton=e.target.closest('[data-update-node],[data-add-node],[data-remove-node],[data-add-edge],[data-remove-edge]');if(caseButton)caseAction(caseButton);if(e.target.closest('[data-save-case]'))saveCase();if(e.target.closest('[data-generate-case]')&&host&&!requestBusy){const item=activeCase();if(item){requestBusy=true;host.postMessage({type:'generateCase',contract:item.contract.id});notify('Gerando proposta de fluxo…');}}if(e.target.closest('[data-start-agent]')&&host){const chosen=[...document.querySelectorAll('.agent-rules input:checked')].map(x=>x.value);if(!chosen.length||chosen.length>4){notify('Selecione de uma a quatro regras.');}else host.postMessage({type:'startAgents',profile:$('agent-profile').value,rules:chosen,instruction:$('agent-instruction').value});}if(e.target.closest('[data-configure-agents]')&&host)host.postMessage({type:'openSettings'});const stop=e.target.closest('[data-stop-agent]');if(stop&&host)host.postMessage({type:'stopAgent',id:stop.dataset.stopAgent});if(e.target.closest('[data-more]')){visible+=18;render();}if(e.target.closest('[data-export]'))downloadContext();});
document.addEventListener('change',e=>{if(e.target.id==='node-select'){selectedNode=e.target.value;render();}});
document.addEventListener('keydown',e=>{const n=e.target.closest('[data-node]');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectedNode=n.dataset.node;render();}});
window.addEventListener('message',e=>{if(!host)return;const m=e.data;if(m.type==='project'){D=m.data;rules=D.contracts.flatMap(c=>c.rules);drafts={};render();}if(m.type==='generated'){requestBusy=false;const c=D.contracts.find(x=>x.id===m.case.contract);if(c){drafts[c.id]=m.case;state={...state,view:'usecases',id:c.id};history.replaceState(null,'',url('usecases',c.id));selectedNode='';render();notify('Fluxo gerado. Revise antes de salvar.');}}if(m.type==='profiles'){agentProfiles=m.profiles;runningAgents=m.running;render();}if(m.type==='saved'){delete drafts[m.contract];notify('Caso de uso salvo no projeto.');}if(m.type==='error'){requestBusy=false;notify(m.message);}});
if(host)host.postMessage({type:'ready'});
render();
</script>
</body>
