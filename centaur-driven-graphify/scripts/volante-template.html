<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light"><title>Volante · {{PROJECT}}</title>
<style>

:root {
  color-scheme:only light;
  --bg:#f6f7f9; --surface:#ffffff; --ink:#202a35; --muted:#5d6b79;

}
*{box-sizing:border-box;scrollbar-color:var(--scroll) var(--bg);scrollbar-width:thin}

*::-webkit-scrollbar-thumb{background:var(--scroll);border:2px solid var(--bg);border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover)}*::-webkit-scrollbar-thumb:active{background:var(--ink)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}h1,h2,h3,p{margin-top:0}
h1,h2,h3{font-family:var(--display);line-height:1.3}h1{font-size:clamp(26px,2.4vw,34px);letter-spacing:-.045em;font-weight:650;margin-bottom:8px}
h2{font-size:18px;font-weight:650;letter-spacing:-.025em}h3{font-size:15px;font-weight:650}
a{color:var(--brand);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
button,a,input,select,textarea,summary{touch-action:manipulation}a,button,summary{transition:background .15s,border-color .15s,color .15s}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
button{cursor:pointer;font:inherit;font-weight:600;padding:10px 14px;min-height:42px}
button,input,select,textarea{border:1px solid var(--line);border-radius:var(--control-radius);background:var(--surface);color:var(--ink)}
button:hover{background:var(--brand-soft);border-color:var(--brand)}button:active{transform:translateY(1px)}
button:disabled{cursor:not-allowed;opacity:.5}button:disabled:active{transform:none}
input,select{font:inherit;padding:9px 12px;min-height:42px}select{max-width:220px;cursor:pointer}
textarea{font:inherit;padding:12px;width:100%;min-height:140px;resize:none;line-height:1.65}

.muted{color:var(--muted)}.small{font-size:12px}.eyebrow{font-size:10px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}

.main{min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:24px;border-bottom:1px solid var(--line);padding:16px 36px;background:var(--surface)}

.search input{width:100%;min-width:0;background:var(--bg);padding-left:38px;padding-right:42px;border-color:transparent;font-size:12px}.search input:focus{border-color:var(--brand)}

.module{min-width:0}.module-heading{display:flex;align-items:center;gap:10px;margin-bottom:14px}.module-heading>.icon{color:var(--muted)}.module h3{margin:0;font-size:13px}.module-heading p{font-size:10px;margin:0;color:var(--muted)}

.capability:before{content:'';position:absolute;left:23px;top:-15px;width:1px;height:14px;background:var(--line)}
.capability:hover{border-color:var(--brand);text-decoration:none;background:var(--surface)}.capability:active{background:var(--brand-soft)}

.capability .capability-intent{font-size:12px;line-height:1.6;margin:9px 0 16px;color:var(--muted)}
.rule-dots{display:flex;gap:5px;margin:15px 0 7px;flex-wrap:wrap}.rule-dot{width:18px;height:5px;border-radius:2px;background:var(--line)}.rule-dot.ok{background:var(--success)}.rule-dot.warn{background:var(--warning)}
.capability small{display:block;font-size:10px;color:var(--muted)}.map-caption{padding:13px 24px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);margin:0;background:var(--surface)}

.action{padding:16px 0;border-bottom:1px solid var(--line)}.action:first-of-type{padding-top:0}.action:last-child{border:0;padding-bottom:0}.action a{font-weight:600}.action p{font-size:13px;margin:6px 0 0}

.decision-panel .decision-link{display:inline-flex;margin-top:13px;min-height:36px;align-items:center;gap:6px;font-size:12px;font-weight:650}
.work-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:start;padding:16px 0;border-top:1px solid var(--line)}.work-row:first-child{border:0;padding-top:0}.work-row:last-child{padding-bottom:0}
.work-row>.icon{color:var(--muted);margin-top:3px}.work-row a{font-size:13px;font-weight:600;color:var(--ink)}.work-row a:hover{color:var(--brand)}.work-row p{font-size:12px;color:var(--muted);margin:5px 0 0}.work-row .chips{margin:2px 0 0}
.empty{padding:28px 16px;text-align:center;background:var(--bg);border:1px dashed var(--line);border-radius:var(--control-radius)}.empty h3{margin-bottom:8px}.empty p{max-width:520px;margin:0 auto 12px}
.notice{padding:14px 18px;background:var(--warn-soft);border:1px solid #ead8bd;border-radius:var(--control-radius);font-size:13px;margin-bottom:20px;overflow-wrap:anywhere}.notice details{margin:0}.notice ul{margin-bottom:0}
.rule{padding:26px 0;border-top:1px solid var(--line)}.rule:first-child{border:0;padding-top:0}.rule h2{font-size:20px;margin-bottom:14px}.rule-head{display:flex;justify-content:space-between;gap:12px}.rule h3{margin-bottom:10px}.rule-id{display:block;color:var(--muted);margin-bottom:10px;font-size:11px}.rule p{margin-bottom:10px}.rule ul{padding-left:20px;font-size:13px}.rule li{margin:7px 0}

.trace>div{padding:14px;border-right:1px solid var(--line);min-width:0}.trace>div:last-child{border:0}.trace small{display:block;color:var(--muted);font-size:9px;letter-spacing:.045em;margin-bottom:7px}.trace strong{font-size:12px;font-weight:600}
.rule-footer{border-top:1px dashed var(--line);padding-top:16px;margin-top:22px;font-size:12px;color:var(--muted)}.rule-footer strong{color:var(--ink)}
.source{border:1px solid var(--line);border-radius:var(--control-radius);margin:12px 0;overflow:hidden}.source summary{padding:13px;cursor:pointer;background:var(--bg);font-size:12px;overflow-wrap:anywhere}.source summary:hover{background:var(--brand-soft)}
.source pre{background:var(--ink);color:#e5eef3;padding:20px;max-height:480px;overflow:auto;line-height:1.9;white-space:pre;tab-size:4}.source-meta{padding:12px 14px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
details>summary:focus-visible{outline-offset:-3px}details:not(.source)>summary{cursor:pointer;font-size:13px;font-weight:600;min-height:32px}details:not(.source)>summary:hover{color:var(--brand)}
.evidence{border-left:2px solid var(--success);padding:10px 0 10px 17px;margin:18px 0;overflow-wrap:anywhere}.evidence p{font-size:13px;margin:8px 0}
.back{display:inline-block;font-size:12px;margin-bottom:18px;min-height:28px}.data-row{display:grid;grid-template-columns:1fr;padding:12px 0;border-bottom:1px solid var(--line);gap:4px;font-size:12px}.data-row:last-child{border:0}.data-row dt{color:var(--muted);font-size:11px}.data-row dd{margin:0;overflow-wrap:anywhere}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0}.pagination span{font-size:12px;color:var(--muted)}
.primary{background:var(--brand);color:var(--surface);border-color:var(--brand);white-space:normal;font-size:12px}.primary:hover{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.notes{background:var(--surface)}.notes button{width:100%;font-size:11px;margin-top:10px}.notes textarea{background:var(--bg);font-size:12px;border-color:var(--line)}.note-help{font-size:11px;color:var(--muted);margin:8px 0}.label{display:block;font-size:15px;font-weight:600;margin:0 0 12px}
.status{position:fixed;bottom:20px;right:20px;max-width:min(450px,calc(100vw - 40px));padding:12px 18px;background:var(--ink);color:var(--surface);border-radius:var(--control-radius);z-index:10}.status:empty{display:none}
.document{max-height:600px;overflow:auto;padding:18px;background:var(--bg);margin-top:14px}.row-list{list-style:none;padding:0;margin:0}.row-list li{padding:14px 0;border-bottom:1px solid var(--line)}.row-list li:last-child{border:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.footer-note{font-size:10px;line-height:1.8;color:var(--muted);margin-top:12px;padding-top:18px;border-top:1px solid var(--line)}
@media(max-width:1200px){.columns{grid-template-columns:minmax(0,1fr) 260px;gap:18px}.content{padding:28px 24px}.topbar{padding:16px 24px}.readout a{padding:16px}.readout-icon{display:none}.module-grid{grid-template-columns:1fr}}
@media(max-width:1000px){.shell{grid-template-columns:180px minmax(0,1fr)}.rail{padding:24px 12px}.columns{grid-template-columns:1fr}.columns>aside{display:grid;grid-template-columns:1fr 1fr;gap:18px}.module-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.heading{align-items:start}.heading button{max-width:160px}.readout a{padding:14px}.readout strong{font-size:20px}}
@media(max-width:700px){.shell{grid-template-columns:1fr}.rail{position:static;height:auto;padding:16px;gap:16px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:22px;padding:0}.brand svg{width:27px;height:27px}.brand small{display:inline;margin-left:8px}.rail nav{display:flex;flex-wrap:wrap;gap:4px}.rail nav a{padding:8px 10px;font-size:11px;gap:6px;min-height:36px}.nav-icon,.rail-footer,.project-block{display:none}.topbar{flex-wrap:wrap;padding:14px 16px;gap:10px}.search{max-width:none;flex-basis:100%}.filter{width:100%;justify-content:space-between}.filter select{flex:1;max-width:none}.content{padding:24px 16px}.heading{display:block;margin-bottom:22px}.heading .eyebrow{overflow-wrap:anywhere}.heading button{margin-top:16px;max-width:none}.columns>aside{display:block}.panel{padding:20px}.map-panel{padding:0}.map-panel>.section-head{padding:20px}.module-grid{padding:20px;grid-template-columns:1fr}.readout a{padding:12px 10px}.readout strong{font-size:19px}.readout span{font-size:10px;display:block;line-height:1.5}.readout{margin-bottom:22px}.section-head{align-items:start}.section-head .small{font-size:10px}.work-row{grid-template-columns:22px minmax(0,1fr)}.work-row .chips{grid-column:2}.trace>div{padding:10px 8px}.trace small{font-size:8px}.trace strong{font-size:11px}.rule-head{display:block}.pagination{flex-wrap:wrap}}
/* Respect the operating system's reduced-motion preference across all controls. */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media(forced-colors:active){*{scrollbar-color:auto}.chip,.panel,.capability,.rule-dot{border:1px solid CanvasText}a,button{forced-color-adjust:auto}}
@media print{.rail,.topbar,.status,button,.pagination,.notes{display:none}.shell,.columns{display:block}.content{padding:0}.panel,.rule{break-inside:avoid}body{background:white}.source pre{white-space:pre-wrap;background:white;color:black;max-height:none}}

<body>
<a class="skip" href="#main">Ir para o conteúdo</a>
<div class="shell">
<aside class="rail"><div class="brand"><svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><circle cx="18" cy="18" r="15" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="18" r="5" stroke="currentColor" stroke-width="2"/><path d="M4 14l9 3m19-3l-9 3m-5 6v10" stroke="currentColor" stroke-width="3"/></svg><span>Volante<small>CENTAUR DRIVEN</small></span></div><div class="project-block"><p class="eyebrow">Centaur / projeto</p><div class="project-name" id="project"></div></div><nav aria-label="Navegação principal" id="navigation"></nav><div class="rail-footer"><p>Seu sistema, por dentro.</p><p class="muted">Comportamento → código → evidência.</p><p id="snapshot"></p></div></aside>
<div class="main"><header class="topbar"><div class="search"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><label class="sr-only" for="search">Buscar no visor</label><input id="search" type="search" placeholder="Buscar comportamento, regra ou arquivo…" autocomplete="off"><button id="clear" onclick="clearSearch()" aria-label="Limpar busca" hidden>×</button></div><div class="filter"><label class="small" for="scope">Módulo</label><select id="scope"></select></div></header><main id="main" class="content" tabindex="-1"></main></div>
</div><div id="feedback" class="status" role="status" aria-live="polite"></div>
<noscript><p>Ative JavaScript para navegar neste visor local. Os contratos e specs continuam disponíveis em .centaur/.</p></noscript>
<script id="volante-data" type="application/json">{{DATA}}</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('volante-data').textContent);
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const routes=[['overview','Visão geral','◉'],['contracts','Contratos','◇'],['code','Código','</>'],['evidence','Evidências','✓'],['next','Próximos passos','→'],['specs','Specs','≡'],['documents','Documentos','▤']];
const rules=D.contracts.flatMap(c=>c.rules);
const deliveryNames={local:'Local',integrated:'Integrada',published:'Publicada'};
let state=readRoute();let visible=18;let noteTimer;let feedbackTimer;
function readRoute(){const p=new URLSearchParams(location.hash.slice(1));return{view:p.get('view')||'overview',id:p.get('id')||'',q:p.get('q')||'',scope:p.get('scope')||''};}
function url(view,id='',extra={}){const p=new URLSearchParams({...state,...extra,view,id});for(const [k,v]of [...p])if(!v)p.delete(k);return '#'+p.toString();}
function notify(message){$('feedback').textContent=message;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>$('feedback').textContent='',6000);}
function chip(text){const tone=['aprovada','implementada','Integrada','Publicada','approved'].includes(text)?'ok':['falhou','Bloqueada'].includes(text)?'bad':['desatualizada','parcial','draft','Bloqueada'].includes(text)?'warn':'';return `<span class="chip ${tone}">${esc(({approved:'Aprovado',draft:'Rascunho',retired:'Retirado'})[text]||text)}</span>`;}
function matches(item){return(!state.scope||item.scope===state.scope)&&(!state.q||JSON.stringify(item).toLocaleLowerCase('pt-BR').includes(state.q.toLocaleLowerCase('pt-BR')));}
function contracts(){return D.contracts.filter(matches);}
function selectedRules(){return rules.filter(matches);}
function ruleLink(r,label){return `<a href="${esc(url('contract',r.contract,{rule:r.id}))}">${esc(label||r.description)}</a>`;}
function title(name,description,action=''){return `<div class="heading"><div><p class="eyebrow">Seu sistema / ${esc(D.project)}</p><h1>${esc(name)}</h1><p class="muted">${esc(description)}</p></div>${action}</div>`;}
function empty(heading,body){return `<div class="empty"><h3>${esc(heading)}</h3><p class="muted">${esc(body)}</p></div>`;}
function sliced(items,render){return items.slice(0,visible).map(render).join('')+(items.length>visible?`<div class="pagination"><span>${visible} de ${items.length} registros</span><button data-more>Mostrar mais 18</button></div>`:'');}
function source(s){return `<details class="source"><summary><span class="mono">${esc(s.path)}:${s.start}–${s.end}</span> · ${esc(s.role)}</summary>${s.code?`<pre><code>${esc(s.code.split('\n').map((l,i)=>`${String(s.start+i).padStart(4,' ')}  ${l}`).join('\n'))}</code></pre>`:''}<div class="source-meta">${esc(s.warning||'Trecho capturado na geração do visor.')} ${s.sha256?`<br><span class="mono">SHA-256 ${esc(s.sha256.slice(0,16))}…</span>`:''}</div></details>`;}
function trace(r){return `<div class="trace"><div><small>IMPLEMENTAÇÃO</small><strong>${esc(r.implementation)}</strong></div><div><small>VERIFICAÇÃO</small>${chip(r.verification)}</div><div><small>ENTREGA REGISTRADA</small><strong>${esc(deliveryNames[r.delivery.stage])}</strong></div></div>`;}
function evidence(e){return `<div class="evidence">${chip(e.verification)} <span class="small muted">${esc(e.method)} · ${esc(formatDate(e.at))}</span><p><strong>${esc(e.summary)}</strong></p><p>${esc(e.reference)}</p>${e.command?`<pre>${esc(Array.isArray(e.command)?e.command.join(' '):e.command)}</pre>`:''}<details><summary class="small">Fontes verificadas e identificação</summary><p class="mono">${esc(e.id)}<br>${esc(e.contract)} / ${esc(e.rule)}<br>Revisão: ${esc(e.revision||'Não registrada')}</p>${Object.entries(e.files).map(([p,h])=>`<p class="mono">${esc(p)}<br>${esc(h)}</p>`).join('')}</details></div>`;}
function formatDate(value){const d=new Date(value);return Number.isNaN(d.getTime())?value:new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short',timeZoneName:undefined}).format(d);}
function icon(name){
  const paths={overview:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',contracts:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',code:'<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-14-2 18"/>',evidence:'<path d="m8 12 3 3 5-6"/><circle cx="12" cy="12" r="9"/>',next:'<path d="M4 12h16m-6-6 6 6-6 6"/>',specs:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/>',documents:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/>',module:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M7 10v7h7"/>',arrow:'<path d="M6 18 18 6M6 6h12v12"/>'};
  return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.next}</svg>`;
}
function overview(){
  const cs=contracts(),rs=selectedRules();
  const decisions=cs.flatMap(c=>(c.decisions||[]).map(d=>({c,d})));
  const groups=D.scopes.filter(s=>(!state.scope||state.scope===s.id)&&cs.some(c=>c.scope===s.id));
  const todo=rs.filter(r=>r.next!=='Observar funcionamento');
  return title('O que o sistema faz','Seu ponto de partida para entender, conferir e direcionar o código.',`<button class="primary" data-export>Exportar contexto para a IA</button>`)+`
  <div class="readout" aria-label="Resumo dos registros filtrados">
    <a href="${esc(url('contracts'))}"><div class="readout-icon">${icon('contracts')}</div><div><strong>${cs.length}</strong><span>contratos no molde</span></div></a>
    <a href="${esc(url('code'))}"><div class="readout-icon">${icon('code')}</div><div><strong>${rs.filter(r=>r.implementation==='implementada').length} <span>/ ${rs.length}</span></strong><span>regras implementadas</span></div></a>
    <a href="${esc(url('evidence'))}"><div class="readout-icon">${icon('evidence')}</div><div><strong>${rs.filter(r=>r.verification==='aprovada').length} <span>/ ${rs.length}</span></strong><span>com evidência atual</span></div></a>
  </div>
  <div class="columns"><div>
    <section class="panel map-panel"><div class="section-head"><div><h2>Mapa de capacidades</h2><p>Do comportamento ao código que o realiza.</p></div>${icon('module')}</div>
    <div class="module-grid">${groups.map(s=>`<div class="module"><div class="module-heading">${icon('module')}<div><h3>${esc(s.id)}</h3><p>${esc(s.owner)} · ${esc(s.code)}</p></div></div>${cs.filter(c=>c.scope===s.id).map(c=>`<a class="capability" href="${esc(url('contract',c.id))}"><div class="card-meta"><span>${esc(c.id)} @ ${c.version}</span>${icon('arrow')}</div><strong>${esc(c.title)}</strong><p class="capability-intent">${esc(c.intent)}</p>${chip(c.status)}${c.rules.some(r=>r.verification==='desatualizada')?chip('desatualizada'):''}<div class="rule-dots" aria-hidden="true">${c.rules.map(r=>`<span class="rule-dot ${r.verification==='aprovada'?'ok':r.implementation==='parcial'?'warn':''}"></span>`).join('')}</div><small>${c.rules.filter(r=>r.verification==='aprovada').length} de ${c.rules.length} regras com evidência atual</small></a>`).join('')}</div>`).join('')||empty('Nenhum contrato neste recorte','Ajuste os filtros ou registre o primeiro contrato para explorar suas capacidades.')}</div>
    <p class="map-caption"><span class="legend"><i></i>Evidência atual</span><span class="legend"><i class="partial"></i>Implementação parcial</span><span class="legend"><i class="unknown"></i>Sem evidência atual</span><br>Cada segmento representa uma regra. Abra uma capacidade para inspecionar.</p></section>
    <section class="panel"><div class="section-head"><div><h2>Trabalho em foco</h2><p>O que ainda separa intenção e realização.</p></div><a href="${esc(url('next'))}" class="small">Ver todos →</a></div><div>${rs.length?todo.slice(0,5).map(r=>`<div class="work-row">${icon('next')}<div>${ruleLink(r)}<p>${esc(r.next)}</p></div><div class="chips">${chip(r.implementation)}</div></div>`).join('')||'<p class="muted">Regras publicadas. Acompanhe os sinais definidos no contrato.</p>':empty('O molde ainda não foi registrado','Defina o primeiro contrato para acompanhar o trabalho.')}</div></section>
  </div><aside>
    <section class="panel decision-panel"><p class="eyebrow">Sua direção · ${decisions.length} ${decisions.length===1?'decisão':'decisões'}</p><h2>${decisions.length?'O próximo avanço precisa de você.':'Decisões abertas'}</h2>${decisions.length?decisions.map(({c,d})=>`<div class="action"><p>${esc(d)}</p><a class="decision-link" href="${esc(url('contract',c.id))}">Revisar ${esc(c.id)} ${icon('next')}</a></div>`).join(''):'<p class="muted small">Nenhuma decisão aberta registrada. Confira os limites antes de ampliar o escopo.</p>'}</section>${notesPanel()}
  </aside></div>`;
}
function notesPanel(){return `<section class="panel notes"><p class="eyebrow">Caderno de direção</p><label for="notes" class="label">Suas notas</label><textarea id="notes" aria-describedby="note-help" placeholder="O que deseja esclarecer ou mudar?"></textarea><p id="note-help" class="note-help">Salvas neste navegador. Não alteram contratos nem enviam tarefas à IA.</p><button data-export>Exportar contexto para a IA</button></section>`;}
function contractList(){const cs=contracts();return title('Contratos','Comportamentos e limites que orientam a implementação.')+`<section class="panel">${cs.length?sliced(cs,c=>`<article class="rule"><span class="mono rule-id">${esc(c.id)} @ ${c.version} · ${esc(c.scope)}</span><h2><a href="${esc(url('contract',c.id))}">${esc(c.title)}</a></h2><p>${esc(c.intent)}</p><div class="chips">${chip(c.status)}<span class="chip">${c.rules.length} regras</span>${c.draft_versions.length?`<span class="chip warn">Rascunhos: ${esc(c.draft_versions.join(', '))}</span>`:''}</div></article>`):empty('Nenhum contrato encontrado','Ajuste a busca ou registre o comportamento desejado com centaur-driven-spec.')}</section>`;}
function contractDetail(){const c=D.contracts.find(x=>x.id===state.id);if(!c)return title('Contrato não encontrado','O registro pode ter sido removido ou não estar neste snapshot.')+`<a href="${esc(url('contracts'))}">Voltar aos contratos</a>`;return `<a class="back" href="${esc(url('contracts'))}">← Contratos</a>`+title(c.title,c.intent,`<button class="primary" data-export>Exportar contexto para a IA</button>`)+`<div class="chips" style="margin-bottom:24px">${chip(c.status)}<span class="chip">${esc(c.id)} @ ${c.version}</span><span class="chip">${esc(c.scope)}</span>${c.draft_versions.length?`<span class="chip warn">Rascunhos disponíveis: ${esc(c.draft_versions.join(', '))}</span>`:''}</div><div class="columns"><section class="panel">${c.rules.map(r=>`<article class="rule" id="rule-${esc(r.id)}"><span class="mono rule-id">${esc(r.key)}</span><h2>${esc(r.description)}</h2><p class="eyebrow">Critérios de aceite</p><ul>${r.acceptance.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${trace(r)}${r.issues.length?`<div class="notice">${r.issues.map(esc).join('<br>')}</div>`:''}<details><summary>Código relacionado · ${r.sources.length} fontes</summary>${r.sources.map(source).join('')||'<p class="muted small">Nenhuma fonte vinculada. A IA precisa localizar e conferir a implementação.</p>'}</details><details style="margin-top:14px"><summary>Evidências · ${r.evidence.length} registros</summary>${r.evidence.map(evidence).join('')||'<p class="muted small">Sem evidência registrada para esta regra.</p>'}</details>${r.delivery.reference?`<details style="margin-top:14px"><summary>Registro de entrega</summary><p class="small">${esc(r.delivery.reference)}<br>Revisão: <code>${esc(r.delivery.revision)}</code><br>${esc(formatDate(r.delivery.at))}</p></details>`:''}<p class="rule-footer"><strong>Próximo passo:</strong> ${esc(r.next)}${r.waiting.length?`<br>Depende de: ${r.waiting.map(dep=>{const d=rules.find(x=>x.key===dep);return d?ruleLink(d,dep):esc(dep);}).join(', ')}`:''}</p></article>`).join('')}</section><aside><section class="panel"><h3>Limites do molde</h3>${list(c.boundaries,'Nenhum limite adicional registrado.')}<h3>Autonomia da IA</h3>${list(c.autonomy,'Autonomia não especificada.')}<h3>Decisões abertas</h3>${list(c.decisions,'Nenhuma decisão aberta registrada.')}</section><section class="panel"><h3>Origem e herança</h3><dl><div class="data-row"><dt>Fonte</dt><dd class="mono">${esc(c.path)}</dd></div><div class="data-row"><dt>Aprovação</dt><dd>${esc(c.approval?.reference||'Não registrada')}</dd></div><div class="data-row"><dt>Responsável</dt><dd>${esc(c.approval?.by||'Não registrado')}</dd></div></dl>${c.inherited.map(p=>`<details><summary>${esc(p.id)} · ${esc(p.title)}</summary>${list(p.boundaries,'')}${list(p.rules.map(r=>r.description),'')}</details>`).join('')||'<p class="small muted">Sem contratos herdados.</p>'}<details style="margin-top:18px"><summary>Versões do contrato · ${c.versions.length}</summary>${c.versions.map(v=>`<details style="margin:12px 0"><summary>Versão ${v.version} · ${esc(v.status)}</summary><pre class="document">${esc(JSON.stringify(v,null,2))}</pre></details>`).join('')}</details><p class="small muted">O código é uma captura local. Abra os arquivos atuais antes de editar.</p></section>${notesPanel()}</aside></div>`;}
function list(items,fallback){return items?.length?`<ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:fallback?`<p class="small muted">${esc(fallback)}</p>`:'';}
function codeView(){const rs=selectedRules().filter(r=>r.sources.length);return title('Código com propósito','Veja os trechos vinculados às regras e entenda por que existem.')+`<section class="panel">${rs.length?sliced(rs,r=>`<article class="rule"><span class="mono rule-id">${esc(r.key)}</span><h2>${ruleLink(r)}</h2>${r.sources.map(source).join('')}</article>`):empty('Nenhuma fonte correspondente','Vincule arquivos e intervalos de linhas ao estado de uma regra. O visor não incorpora o repositório inteiro.')}</section>`;}
function evidenceView(){const rs=selectedRules().filter(r=>r.evidence.length);return title('O que foi comprovado','Evidências são conferidas contra o contrato e os arquivos no momento da geração.')+`<section class="panel">${rs.length?sliced(rs,r=>`<article class="rule"><h2>${ruleLink(r)}</h2>${r.evidence.map(evidence).join('')}</article>`):empty('Sem evidências correspondentes','Execute a verificação do comportamento e registre as fontes verificadas. Um checklist marcado não comprova funcionamento.')}</section>`;}
function nextView(){const rs=selectedRules();return title('Próximos passos','A diferença entre o molde desejado e o estado comprovado orienta a execução.')+`<section class="panel">${rs.length?sliced(rs,r=>`<article class="rule"><span class="mono rule-id">${esc(r.key)}</span><h2>${esc(r.next)}</h2><p>${ruleLink(r)}</p>${trace(r)}${r.waiting.length?`<p class="small">Dependências: ${esc(r.waiting.join(', '))}</p>`:''}${r.issues.length?`<p class="small">${esc(r.issues.join('; '))}</p>`:''}</article>`):empty('Ainda não há próximos passos derivados','Registre contratos e o estado das regras para que as lacunas apareçam aqui.')}</section>`;}
function specsView(){const specs=D.specs.filter(matches);return title('Specs e entregas','Planejamentos existentes preservados. Checklist e evidência têm significados diferentes.')+`<section class="panel">${specs.length?sliced(specs,s=>`<article class="rule"><span class="mono rule-id">${esc(s.id)}</span><h2>${esc(s.title)}</h2><div class="chips">${chip(s.status)}<span class="chip">${s.tasks.filter(t=>t.done).length}/${s.tasks.length} tasks marcadas</span></div><p class="small muted">Contrato: ${esc(s.contract||'Sem vínculo; estado de verificação desconhecido')}</p><ul class="row-list">${s.tasks.map(t=>`<li><span aria-label="${t.done?'Marcada como concluída':'Pendente'}">${t.done?'✓':'○'}</span> ${esc(t.title)}</li>`).join('')}</ul><details style="margin-top:18px"><summary>Ler spec completa</summary><pre class="document">${esc(s.body)}</pre></details></article>`):empty('Nenhuma spec correspondente','Specs dos diretórios configurados em workspace.json aparecem aqui.')}</section>`;}
function documentsView(){const ds=D.documents.filter(d=>!state.q||JSON.stringify(d).toLocaleLowerCase('pt-BR').includes(state.q.toLocaleLowerCase('pt-BR')));return title('Documentos do sistema','Fluxos, perspectivas e decisões registrados em docs/system. Documentos não são prova de implementação.')+`<section class="panel">${ds.length?sliced(ds,d=>`<article class="rule"><h2>${esc(d.title)}</h2><p class="mono muted">${esc(d.path)}</p><details><summary>Ler documento</summary><pre class="document">${esc(d.body)}</pre></details></article>`):empty('Nenhum documento correspondente','Use Graphify para manter fluxos e perspectivas com fontes confirmadas.')}</section>`;}
function render(){document.title=`${routes.find(x=>x[0]===state.view)?.[1]||'Contrato'} · Volante · ${D.project}`;$('search').value=state.q;$('clear').hidden=!state.q;$('scope').value=state.scope;$('navigation').innerHTML=routes.map(([v,t,i])=>`<a href="${esc(url(v))}" ${state.view===v||(v==='contracts'&&state.view==='contract')?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon(v)}</span>${esc(t)}</a>`).join('');const view=({overview,contracts:contractList,contract:contractDetail,code:codeView,evidence:evidenceView,next:nextView,specs:specsView,documents:documentsView})[state.view];$('main').innerHTML=(D.warnings.length?`<div class="notice"><details><summary>${D.warnings.length} inconsistência(s) nos registros</summary><ul>${D.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></details></div>`:'')+(view?view():title('Visão não encontrada','Selecione uma seção no menu.'))+`<p class="footer-note">Snapshot de ${esc(formatDate(D.generated_at))} · revisão ${esc(D.revision?.slice(0,12)||'não disponível')}${D.dirty?' · com alterações locais':''}. Não acompanha alterações em tempo real. Regere o Volante após mudanças.<br>As evidências registram verificações específicas; não garantem ausência de bugs. Entrega reflete o registro da integração/publicação.</p>`;bindNotes();}
function storageKey(){return 'centaur-notes:'+location.pathname.replace(/(?:volante|andamento)\.html$/,'andamento.html');}
let localNotes='';
try{localNotes=localStorage.getItem(storageKey())||'';}catch(_){/* Page stays usable without browser storage. */}
function bindNotes(){const notes=$('notes');if(!notes)return;notes.value=localNotes;const grow=()=>{notes.style.height='auto';notes.style.height=Math.max(140,notes.scrollHeight)+'px';};grow();notes.addEventListener('input',()=>{localNotes=notes.value;grow();try{localStorage.setItem(storageKey(),localNotes);$('note-help').textContent='Salvas neste navegador. Não alteram contratos nem enviam tarefas à IA.';}catch(_){$('note-help').textContent='Armazenamento indisponível. Exporte as notas antes de fechar.';}});try{localStorage.getItem(storageKey());}catch(_){$('note-help').textContent='Armazenamento indisponível. Exporte as notas antes de fechar.';}}
function downloadContext(){const cs=state.view==='contract'?D.contracts.filter(c=>c.id===state.id):contracts();const text=['# Direção para a IA — '+D.project,'','Snapshot: '+D.generated_at,'Revisão: '+(D.revision||'não disponível'),'','## Minhas notas',localNotes||'(sem notas)','',...cs.flatMap(c=>['## '+c.id+' @ '+c.version+' — '+c.title,c.intent,'Limites: '+(c.boundaries||[]).join('; '),'Autonomia: '+(c.autonomy||[]).join('; '),'Decisões abertas: '+(c.decisions||[]).join('; '),...c.rules.flatMap(r=>['','### '+r.key+' — '+r.description,'Aceite: '+r.acceptance.join('; '),'Estado: '+r.implementation+' / '+r.verification+' / '+deliveryNames[r.delivery.stage],'Próximo passo: '+r.next,'Fontes: '+r.sources.map(s=>s.path+':'+s.start+'-'+s.end).join(', '),'Evidências: '+r.evidence.map(e=>e.id).join(', ')])]),'','Confira fontes atuais e contratos antes de agir. Esta exportação não altera aprovações nem concede novas permissões.'].join('\n');const blob=new Blob([text],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='volante-direcao.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('Contexto exportado. Envie o arquivo à IA com sua instrução.');}
$('project').textContent=D.project;$('snapshot').textContent='Snapshot · '+formatDate(D.generated_at);$('scope').innerHTML='<option value="">Todos os módulos</option>'+D.scopes.map(s=>`<option value="${esc(s.id)}">${esc(s.id)}</option>`).join('');
function updateFilters(){state=readRoute();state.q=$('search').value;state.scope=$('scope').value;visible=18;history.replaceState(null,'',url(state.view,state.id));render();}
$('search').addEventListener('input',e=>{if(!e.isComposing)updateFilters();});$('search').addEventListener('compositionend',updateFilters);function clearSearch(){$('search').value='';updateFilters();$('search').focus();}$('scope').addEventListener('change',updateFilters);
window.addEventListener('hashchange',()=>{if(location.hash==='#main'){ $('main').focus();return;}state=readRoute();visible=18;render();$('main').focus({preventScroll:true});const rid=new URLSearchParams(location.hash.slice(1)).get('rule');if(rid)document.getElementById('rule-'+rid)?.scrollIntoView({block:'start'});else window.scrollTo(0,0);});
document.addEventListener('click',e=>{if(e.target.closest('[data-more]')){visible+=18;render();}if(e.target.closest('[data-export]'))downloadContext();});
render();
</script>
</body>
