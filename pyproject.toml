[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "centaur-cli"
dynamic = ["version"]
description = "Harness de desenvolvimento assistido por IA com OpenRouter, Codex e Claude"
readme = "README.pypi.md"
authors = [{name = "Diego Cabral"}]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai", "cli", "harness", "codex", "claude", "openrouter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
]

[project.optional-dependencies]
attachments = ["mss>=10,<11", "Pillow>=10"]
computer = ["PyAutoGUI>=0.9.54,<1", "mss>=10,<11", "Pillow>=10", "pyperclip>=1.9,<2"]

[project.urls]
Repository = "https://github.com/Dalistor/Centaur-Driven"
Documentation = "https://github.com/Dalistor/Centaur-Driven/tree/main"
Issues = "https://github.com/Dalistor/Centaur-Driven/issues"

[tool.setuptools.dynamic]
version = {attr = "centaur_cli.__version__"}

[project.scripts]
centaur = "centaur_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["centaur_cli*"]
namespaces = false

[tool.setuptools.package-data]
centaur_cli = ["skills/*/SKILL.md", "skills/*/references/*", "skills/*/scripts/*.py", "skills/*/scripts/*.sh", "skills/*/templates/*", "skills/_internal/*/SKILL.md", "skills/_internal/*/references/*", "skills/_internal/*/scripts/*.py", "skills/_internal/*/scripts/*.sh", "skills/_internal/*/templates/*"]
